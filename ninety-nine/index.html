<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efe4c9">
<title>Ninety-Nine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Ninety-Nine v0.3 "the descent": 99 floors of basement, a party of four, taps when the gauge fills. Retro magazine look; only possessed things are in colour. */
:root{--paper:#efe4c9;--paper2:#f6eedc;--ink:#1c1915;--ink2:#4a4239;--muted:#7a7064;--red:#c8362b;--ember:#c8362b;--frost:#4e9fd1;--bloom:#4f8f3a;--clay:#c28a2c;--tide:#2b3f8c;--fd:'Rye',Georgia,serif;--fh:'Oswald','Arial Narrow',Arial,sans-serif;--fb:'Libre Baskerville',Georgia,serif;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-bottom:70px}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.4;background-image:radial-gradient(rgba(28,25,21,.07) 1px,transparent 1.2px);background-size:5px 5px;padding:10px max(12px,env(safe-area-inset-left,0px)) 80px}
h1,h2,p{margin:0}.wrap{max-width:520px;margin:0 auto}
button{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:12px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);padding:6px 10px;min-height:34px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper2)}button.pri{background:var(--ink);color:var(--paper2)}button.pri:hover{background:var(--red);border-color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}button.on{background:var(--ink);color:var(--paper2)}
.mast{border-top:4px solid var(--ink);border-bottom:2px solid var(--ink);padding:6px 0;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.mast h1{font-family:var(--fd);font-size:26px;line-height:1}.sub{font-family:var(--fh);text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--ink2)}
.floorno{font-family:var(--fd);font-size:34px;line-height:1;text-align:right}.floorno small{font-family:var(--fh);font-size:11px;letter-spacing:.1em;display:block;color:var(--ink2)}
.gold{font-family:var(--fh);font-size:16px;letter-spacing:.04em}.gold small{font-size:10px;color:var(--ink2);letter-spacing:.1em}
.box{border:2px solid var(--ink);background:var(--paper2);padding:10px 12px;margin-top:8px;position:relative}
.kick{font-family:var(--fh);text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--ink2)}
.row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.sb{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}
.hoz{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-left:8px solid var(--ember);background:var(--paper2);padding:8px 10px;margin-top:8px}.hoz p{font-style:italic;font-size:13px}
.ring{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;position:relative;min-height:80px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.f{display:block;width:100%;text-align:left;font-size:12px;border:2px solid var(--ink);padding:5px 6px;background:var(--paper2);min-width:0;position:relative;min-height:34px}
.f[role=button]{cursor:pointer}
.f.rogue{border:2px dashed var(--red);background:repeating-linear-gradient(135deg,var(--paper2) 0 10px,#f0dcc8 10px 12px)}.f.boss{border-width:3px}
.f.out{opacity:.4}.f.focus{outline:3px solid var(--red);outline-offset:1px}
.f.ready{box-shadow:0 0 0 3px var(--paper2),0 0 0 5px var(--ink);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--paper2),0 0 0 5px var(--ink)}50%{box-shadow:0 0 0 3px var(--paper2),0 0 0 5px var(--red)}}
.f .top{display:flex;gap:6px;align-items:center}.f b{font-family:var(--fh);text-transform:uppercase;font-size:13px;line-height:1.1;display:block}
.hp{height:8px;border:1.5px solid var(--ink);background:var(--paper2);margin-top:3px}.hp i{display:block;height:100%;background:var(--ink);transition:width .25s}
.f.rogue .hp i{background:var(--red)}
.gg{height:5px;border:1px solid var(--ink2);background:var(--paper2);margin-top:3px}.gg i{display:block;height:100%;background:var(--ink2);transition:width .25s}.gg.full i{background:var(--red)}
.wind{height:5px;border:1px solid var(--red);background:var(--paper2);margin-top:3px}.wind i{display:block;height:100%;background:var(--red);transition:width .9s linear}
.sp{display:flex;gap:3px;margin-top:4px}.sp button{min-height:26px;padding:2px 7px;font-size:10px;letter-spacing:.08em;border-width:1.5px;flex:1}
.sp button.go{background:var(--red);border-color:var(--red);color:#fff}.sp button.hold{flex:0 0 auto}
.st{font-size:10px;font-family:var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--fd);font-size:44px;line-height:1;color:var(--ink);pointer-events:none;opacity:0;text-shadow:2px 2px 0 var(--paper2);z-index:3;white-space:nowrap}
.stamp.show{animation:pop .7s ease-out}.stamp.red{color:var(--red)}.stamp.big{font-size:60px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-8deg) scale(1)}}
.hit{animation:hit .3s}@keyframes hit{0%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(3px)}100%{transform:translateX(0)}}
.pt.live{filter:drop-shadow(0 0 4px var(--c))}.pt.wild{animation:shake .6s infinite}@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-1.5px) rotate(-2deg)}75%{transform:translateX(1.5px) rotate(2deg)}}
.f.out .pt.wild{animation:none}img.pt{flex:none}
.bar{height:10px;border:2px solid var(--ink);background:var(--paper2);margin-top:6px}.bar i{display:block;height:100%;background:var(--ink);transition:width .9s linear}
.pbp{font-size:12px;margin-top:6px;border-top:1px dotted var(--muted);padding-top:4px}.pbp div{padding:2px 0;border-bottom:1px dotted #d8ccb0}.pbp .t{font-family:var(--fh);color:var(--ink2);font-size:11px;margin-right:6px}
.line{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted #d8ccb0}.line:last-child{border-bottom:0}.line .who{flex:1;min-width:0}.line b{font-family:var(--fh);text-transform:uppercase;font-size:13px}
.line button{min-height:30px;padding:4px 8px;font-size:11px}
.tag{display:inline-block;font-family:var(--fh);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);padding:0 5px;margin-left:4px}.tag.red{border-color:var(--red);color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(28,25,21,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modal>div{background:var(--paper2);border:3px solid var(--ink);padding:14px 16px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.hl{font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em}.hl.big{font-size:22px;line-height:1.1}
.verdict{display:inline-block;font-family:var(--fh);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--red);border:3px solid var(--red);padding:3px 10px;transform:rotate(-4deg);font-size:14px;margin:8px 0}.verdict.ink{color:var(--ink);border-color:var(--ink)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding:8px max(12px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-bottom,0px));z-index:10}.bottom .wrap{display:flex;gap:8px;justify-content:space-between;align-items:center}
details summary{cursor:pointer;font-family:var(--fh);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){.stamp.show{animation:none;opacity:1}.hp i,.gg i,.wind i,.bar i{transition:none}.f.ready{animation:none}.pt.wild{animation:none}}
</style></head><body><div class="wrap" id="app"></div><div class="bottom" id="bottom"></div><div id="modal"></div>
<script id="engine">
// Ninety-Nine v0.3 "the descent" — engine. Pure state + per-second stepping; no DOM. Exported for node tests.
const AFF=['Ember','Frost','Bloom','Clay','Tide'];
const FEEDS={Bloom:'Ember',Ember:'Clay',Clay:'Frost',Frost:'Tide',Tide:'Bloom'};const QUELLS={Bloom:'Clay',Clay:'Tide',Tide:'Ember',Ember:'Frost',Frost:'Bloom'};
const STATS=['Brawn','Grit','Heart','Pace','Wits','Knack'];
// bodies: sp = stat growth per level; junk are the flimsy modern throwaways that fill the floors
const SP={
 candle:{n:'Candle',y:'Rōsoku-bi',ab:'light',art:'candle',fav:'Ember',sp:{Brawn:.4,Grit:.8,Heart:1.2,Pace:1.0,Wits:1.6,Knack:1.0}},
 chime:{n:'Wind chime',y:'Fūrin-kozō',ab:'toll',art:'chime',fav:'Frost',sp:{Brawn:.4,Grit:1.0,Heart:.8,Pace:1.2,Wits:1.4,Knack:1.2}},
 whisk:{n:'Whisk',y:'Sasara-bake',ab:'sweep',art:'whisk',fav:'Bloom',sp:{Brawn:1.0,Grit:.6,Heart:.6,Pace:1.8,Wits:.6,Knack:1.4}},
 teapot:{n:'Teapot',y:'Kyūsu-bōzu',ab:'steam',art:'teapot',fav:'Clay',sp:{Brawn:.8,Grit:1.4,Heart:1.0,Pace:.6,Wits:1.2,Knack:1.0}},
 ladle:{n:'Ladle',y:'Hishaku-bake',ab:'carry',art:'ladle',fav:'Tide',sp:{Brawn:1.6,Grit:1.2,Heart:.6,Pace:1.0,Wits:.4,Knack:1.2}},
 kokeshi:{n:'Kokeshi',y:'Kokeshi-gami',ab:'comfort',art:'kokeshi',fav:'Bloom',sp:{Brawn:.6,Grit:1.0,Heart:1.8,Pace:.8,Wits:.8,Knack:1.0}},
 handheld:{n:'Handheld console',y:'Denchi-kozō',ab:'light',art:'handheld',fav:'Frost',modern:1,sp:{Brawn:.5,Grit:.9,Heart:.8,Pace:1.4,Wits:1.5,Knack:1.1}},
 pet:{n:'Pocket pet',y:'Tamago-warashi',ab:'comfort',art:'pet',fav:'Bloom',modern:1,sp:{Brawn:.4,Grit:.8,Heart:2.0,Pace:1.0,Wits:1.0,Knack:.8}},
 cooker:{n:'Rice cooker',y:'Kamado-gami',ab:'steam',art:'cooker',fav:'Clay',modern:1,sp:{Brawn:.9,Grit:1.6,Heart:1.2,Pace:.5,Wits:1.0,Knack:.8}},
 vending:{n:'Vending machine',y:'Jihanki-nyūdō',ab:'steam',art:'vending',fav:'Ember',modern:1,boss:1,sp:{Brawn:1.1,Grit:1.9,Heart:.8,Pace:.5,Wits:1.3,Knack:.6}},
 umbrella:{n:'Vinyl umbrella',y:'Sutegasa-kozō',ab:'sweep',art:'umbrella',fav:'Tide',junk:1,sp:{Brawn:.6,Grit:.5,Heart:.4,Pace:1.6,Wits:.5,Knack:1.2}},
 lighter:{n:'Lighter',y:'Hyakuen-bi',ab:'light',art:'lighter',fav:'Ember',junk:1,sp:{Brawn:.4,Grit:.4,Heart:.4,Pace:1.2,Wits:1.3,Knack:1.0}},
 can:{n:'Empty can',y:'Aki-kan',ab:'carry',art:'can',fav:'Clay',junk:1,sp:{Brawn:.9,Grit:1.1,Heart:.3,Pace:.8,Wits:.3,Knack:.8}},
 bag:{n:'Plastic bag',y:'Fukuro-obake',ab:'sweep',art:'bag',fav:'Frost',junk:2,sp:{Brawn:.5,Grit:.4,Heart:.4,Pace:2.0,Wits:.6,Knack:1.3}},
 battery:{n:'Dead battery',y:'Denchi-gara',ab:'toll',art:'battery',fav:'Bloom',junk:2,sp:{Brawn:.7,Grit:.9,Heart:.3,Pace:.7,Wits:1.1,Knack:.7}}};
const ABIL={light:{n:'Light',s:'Flare',sfx:'ピカッ',text:'strikes first; Flare hits all and dazzles 5 s'},toll:{n:'Toll',s:'Great Toll',sfx:'ゴーン',text:'rings every 10 s; Great Toll hits all, stuns 2 s and breaks a wind-up'},sweep:{n:'Sweep',s:'Clean Sweep',sfx:'ザザッ',text:'30% splash; Clean Sweep hits all'},steam:{n:'Steam',s:'Scald',sfx:'ジュワッ',text:'burns on hit; Scald doubles on the focus and burns 8 s'},carry:{n:'Carry',s:'Bulwark',sfx:'ガシッ',text:'+25% HP; Bulwark shields the line 6 s'},comfort:{n:'Comfort',s:'Lullaby',sfx:'ねんね',text:'heals every 5 s; Lullaby heals all, lifts the fallen, slows enemies'}};
const NAMES=['Kiku','Hana','Fumi','Yone','Tome','Matsu','Take','Tora','Kuma','Gorō','Tetsu','Shin','Kane','Chiyo','Sada','Masa','Hide','Tami','Nobu','Yoshi','Mitsu','Haru','Natsu','Aki','Fuyu','Kōta','Riku','Sora','Rin','Ume','Gen','Ryō','Sen','Taki','Kō'];
const CFG={floors:99,grow:1.03,walk:2,wind:3,junkHp:.3,bossHp:1.6,offlineCap:8*3600,farmMul:.5,benchMul:.6,away:60};
const bounty=n=>Math.round(3*Math.pow(1.1,n-1));
const lvCost=L=>Math.round(8*Math.pow(1.12,L-1));
const rngOf=seed=>()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,seed|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
const interval=p=>Math.max(.5,Math.min(6,4*10/p));

// ===== fighters =====
function restat(c){const P=SP[c.sp];c.st={};STATS.forEach(k=>c.st[k]=Math.round((10+P.sp[k]*(c.lv-1))*(c.mul||1)));c.abs=[P.ab];
 const max=Math.round((c.st.Grit*6+10)*(c.abs.includes('carry')?1.25:1)*(c.hpMul||1));const was=c.max||max;c.max=max;c.hp=c.hp==null?max:Math.min(max,Math.max(0,c.hp+(max-was)));return c;}
let NID=1;
function make(o){const c=Object.assign({id:'e'+(NID++),gauge:0,hold:false,rogue:false,burn:0,burnDmg:0,shield:0,shieldT:0,dazzle:0,stun:0,wind:0,next:0},o);restat(c);c.next=c.abs.includes('light')?0:interval(c.st.Pace);return c;}

// ===== the fight: stepped one second at a time =====
function newFight(L,R){return {t:0,L,R,log:[],done:false,focus:null};}
const alive=s=>s.filter(x=>x.hp>0);
function hurt(F,tgt,v){if(tgt.shield>0&&F.t<tgt.shieldT){const a=Math.min(tgt.shield,v);tgt.shield-=a;v-=a;}tgt.hp-=v;return v;}
function dmg(F,a,d,fed){const base=Math.max(a.st.Brawn,a.st.Wits);let m=1;if(QUELLS[a.aff]===d.aff)m*=1.5;if(QUELLS[d.aff]===a.aff)m*=.75;if(fed)m*=1.25;if(F.t<a.dazzle)m*=.5;const crit=F.rng()<(a.st.Knack/200+(a.abs.includes('light')?.1:0));if(crit)m*=2;return {v:Math.max(1,Math.round(base*m-d.st.Grit/3)),crit};}
function push(F,k,o){o.t=F.t;o.k=k;F.log.push(o);return o;}
function down(F,x,by){if(x.hp<=0&&!x.down){x.hp=0;x.down=true;x.wind=0;push(F,'down',{who:x,by});}}
const fedOf=(side,i)=>i>0&&side[i-1].hp>0&&FEEDS[side[i-1].aff]===side[i].aff;
function target(F,a,foes){const f=alive(foes);if(!f.length)return null;if(F.focus&&foes.some(x=>x.id===F.focus&&x.hp>0))return foes.find(x=>x.id===F.focus);return f[0];}
function special(F,a,ab,side,foes){a.gauge=0;a.wind=0;const f=alive(foes),W=a.st.Wits,B=a.st.Brawn,dz=F.t<a.dazzle?.5:1;const o=push(F,'special',{who:a,ab,hits:[]});
 const hit=(x,v)=>{v=Math.max(1,Math.round(v*dz-x.st.Grit/3));hurt(F,x,v);o.hits.push([x,v]);down(F,x,a);};
 if(ab==='light')f.forEach(x=>{hit(x,W*.8);x.dazzle=F.t+5;});
 else if(ab==='toll')f.forEach(x=>{hit(x,W*1.2);x.stun=F.t+2;x.next=Math.max(x.next,F.t+2);if(x.wind){x.wind=0;x.gauge=50;o.broke=(o.broke||[]).concat(x);}});
 else if(ab==='sweep')f.forEach(x=>hit(x,B));
 else if(ab==='steam'){const x=target(F,a,foes);if(x){hit(x,Math.max(B,W)*2);x.burn=8;x.burnDmg=W*.3;}}
 else if(ab==='carry'){alive(side).forEach(x=>{x.shield=a.st.Grit*2;x.shieldT=F.t+6;});o.shield=a.st.Grit*2;}
 else if(ab==='comfort'){side.forEach(x=>{const v=Math.min(x.max-x.hp,Math.round(a.st.Heart*1.5));if(x.hp<=0){x.down=false;o.lifted=(o.lifted||[]).concat(x);}x.hp+=v;o.hits.push([x,v]);});f.forEach(x=>x.next+=2);}}
function act(F,side,foes){side.forEach((a,i)=>{if(a.hp<=0)return;const t=F.t,junk=!!SP[a.sp].junk; // junk never heals or casts: it is flimsy on purpose
 if(a.burn>0){const b=Math.max(1,Math.round(a.burnDmg));hurt(F,a,b);a.burn--;push(F,'burn',{who:a,v:b});down(F,a);if(a.hp<=0)return;}
 if(t>0&&t%10===0&&a.abs.includes('toll'))alive(foes).forEach(f=>{const v=Math.max(1,Math.round(a.st.Wits*.3));hurt(F,f,v);push(F,'toll',{who:a,tgt:f,v});down(F,f,a);});
 if(t>0&&t%5===0&&!junk){const heal=a.st.Heart*.4+(a.abs.includes('comfort')?a.st.Heart*.3:0);const h=alive(side).sort((x,y)=>x.hp/x.max-y.hp/y.max)[0];if(h&&h.hp<h.max&&heal>=1){const v=Math.min(h.max-h.hp,Math.round(heal));h.hp+=v;push(F,'heal',{who:a,tgt:h,v});}}
 if(a.gauge>=100&&!junk){if(a.rogue){if(!a.wind){a.wind=t+CFG.wind;push(F,'wind',{who:a});}else if(t>=a.wind&&t>=a.stun){special(F,a,a.abs[0],side,foes);return;}}
  else if(!a.hold){special(F,a,a.abs[0],side,foes);return;}}
 if(t>=a.next&&t>=a.stun){const tg=target(F,a,foes);if(!tg)return;const fed=fedOf(side,i);const r=dmg(F,a,tg,fed);const v=hurt(F,tg,r.v);push(F,'hit',{who:a,tgt:tg,v,crit:r.crit,fed,adv:QUELLS[a.aff]===tg.aff,dis:QUELLS[tg.aff]===a.aff});
  a.gauge=Math.min(100,a.gauge+(a.rogue?15:25));tg.gauge=Math.min(100,tg.gauge+(tg.rogue?5:10));
  if(a.abs.includes('steam')&&tg.burn<5){tg.burn=5;tg.burnDmg=a.st.Wits*.2;}
  if(a.abs.includes('sweep')){const o=alive(foes).find(f=>f!==tg);if(o){const v2=Math.max(1,Math.round(r.v*.3));hurt(F,o,v2);push(F,'sweep',{who:a,tgt:o,v:v2});down(F,o,a);}}
  down(F,tg,a);a.next=t+interval(a.st.Pace);}});}
function settle(F){if(F.done)return;const lw=alive(F.L).length,rw=alive(F.R).length;if(!lw||!rw||F.t>900){F.done=true;F.won=lw>0&&rw===0;push(F,'end',{won:F.won});}}
function step(F){if(F.done)return;act(F,F.L,F.R);act(F,F.R,F.L);F.t++;settle(F);}

// ===== floors =====
const stratum=n=>Math.ceil(n/9);
const RES1=[['Taro','ladle','Tide'],['Kuro','teapot','Clay'],['Suzu','chime','Frost'],['Hime','whisk','Bloom'],null,['Ume','ladle','Clay'],['Gen','chime','Ember'],['Fumi','kokeshi','Frost'],['The machine on nine','vending','Ember']];
function floorPlan(S,n){const r=rngOf(S.seed*1000+n);const s=stratum(n),boss=n%9===0;
 if(n%9===5){const needs=['light','carry','steam','comfort','toll','sweep'];const need=needs[(s-1)%needs.length];const names={light:'A dark passage',carry:'A flooded landing',steam:'A frozen stair',comfort:'A grieving room',toll:'A silent hall',sweep:'A choked corridor'};return {n,kind:'challenge',need,amount:15*n,name:names[need]};}
 const junk=Object.keys(SP).filter(k=>SP[k].junk&&SP[k].junk<=s);const k=s===1?2:s<5?3:4;
 const pack=()=>Array.from({length:k},()=>{const sp=junk[Math.floor(r()*junk.length)];return {name:SP[sp].n,sp,aff:SP[sp].fav,lv:n,mul:Math.pow(CFG.grow,n),rogue:true,hpMul:CFG.junkHp,bounty:bounty(n)};});
 let res;if(n<=9){const d=RES1[n-1];res={name:d[0],sp:d[1],aff:d[2]};}
 else{const pool=Object.keys(SP).filter(k=>!SP[k].junk&&(boss?SP[k].modern:!SP[k].boss));const sp=pool[Math.floor(r()*pool.length)];const aff=r()<.6?SP[sp].fav:AFF[Math.floor(r()*5)];res={name:boss?'The '+SP[sp].n.toLowerCase()+' on '+n:NAMES[(n*7+s)%NAMES.length],sp,aff};}
 Object.assign(res,{id:'r'+n,floor:n,lv:n+(boss?4:2),mul:Math.pow(CFG.grow,n),rogue:true,hpMul:boss?CFG.bossHp:1,bounty:bounty(n)*(boss?10:5),resident:true});
 const escorts=boss?pack().slice(0,2):[];return {n,kind:'fight',boss,packs:[pack(),pack()],resident:res,escorts};}

// ===== game state =====
function newGame(seed,now){const S={v:4,seed:seed||((Date.now()&0xffff)+1),gold:0,deep:0,roster:[],party:[],run:{phase:'home',floor:1,enc:0,walk:0},log:[],seen:{},t:0,last:now==null?Date.now():now,stats:{tamed:0,fights:0,falls:0}};
 const pochi=make({id:'pochi',name:'Pochi',sp:'candle',aff:'Ember',lv:3,floor:0});const momo=make({id:'momo',name:'Momo',sp:'kokeshi',aff:'Bloom',lv:2,floor:0});
 S.roster.push(pochi,momo);S.party=['pochi','momo'];return S;}
const byId=(S,id)=>S.roster.find(c=>c.id===id);
const partyOf=S=>S.party.map(id=>byId(S,id)).filter(Boolean);
const benched=S=>S.roster.filter(c=>!S.party.includes(c.id));
const benchRate=S=>benched(S).reduce((s,c)=>s+c.lv*CFG.benchMul,0)/60; // gold per second
function farmRate(S){if(!S.deep)return 0;const p=floorPlan(S,S.deep);if(p.kind!=='fight')return bounty(S.deep)*4/60*CFG.farmMul;const g=p.packs.flat().reduce((s,e)=>s+e.bounty,0)+p.resident.bounty*.2;return g/90*CFG.farmMul;} // a floor every ~90 s, half pay while nobody watches
function note(S,text){S.log.push({t:S.t,text});if(S.log.length>60)S.log.shift();}
function say(S,key,text){if(S.seen[key])return;S.seen[key]=S.t;S.hoz={key,text,t:S.t};}

function spawn(S){const R=S.run,P=floorPlan(S,R.floor),party=partyOf(S);
 if(P.kind==='challenge'){R.phase='challenge';R.prog=0;R.need=P.need;R.amount=P.amount;R.cname=P.name;note(S,`B${R.floor}: ${P.name}. It wants ${ABIL[P.need].n}.`);return;}
 let foes;if(R.enc<2)foes=P.packs[R.enc].map(make);else foes=[make(P.resident)].concat(P.escorts.map(make));
 party.forEach(c=>{c.next=c.abs.includes('light')?0:interval(c.st.Pace);c.stun=0;c.dazzle=0;c.shield=0;c.shieldT=0;c.burn=0;c.wind=0;}); // fight clocks restart; hp and gauge carry over
 S.F=newFight(party,foes);S.F.rng=rngOf(S.seed*7919+R.floor*31+R.enc+S.stats.fights);S.stats.fights++;R.phase='fight';
 if(R.enc===2&&P.boss)say(S,'boss'+R.floor,'That one has been down there a long time. Walk in charged.');}
function resolve(S){const F=S.F,R=S.run;S.F=null;const P=floorPlan(S,R.floor);
 if(F.won){const g=F.R.reduce((s,e)=>s+(e.bounty||0),0);S.gold+=g;const res=F.R.find(e=>e.resident);
  if(res){const c=make({id:res.id,name:res.name,sp:res.sp,aff:res.aff,lv:res.lv,floor:R.floor});if(!byId(S,c.id)){S.roster.push(c);if(S.party.length<4)S.party.push(c.id);}S.stats.tamed++;
   note(S,`${res.name} is tamed: a new face for the shop. +${g} g.`);say(S,'tame','One more for the shop. The ones you leave upstairs still earn their keep.');
   S.deep=Math.max(S.deep,R.floor);R.floor++;R.enc=0;if(R.floor>CFG.floors){R.phase='done';say(S,'done','Ninety-nine. The basement is quiet. Go upstairs and rest.');return;}}
  else{note(S,`Pack cleared. +${g} g.`);R.enc++;if(R.enc===2&&partyOf(S).some(c=>c.gauge>=100&&!c.hold))say(S,'hold','A full gauge is wasted on junk. Hold it for the one at the back.');}
  R.phase='walk';R.walk=CFG.walk;}
 else{S.stats.falls++;R.phase='home';healAll(S);note(S,`The line broke on B${R.floor}. The bodies come home; the four hold B${S.deep||1} until you go again.`);say(S,'fall','Nobody died; things don\'t. Level them, change the order, go again.');}}
function tick(S){S.t++;S.gold+=benchRate(S);const R=S.run;if(R.phase==='home')S.gold+=farmRate(S); // the four hold the deepest floor while you shop

 else if(R.phase==='fight'){step(S.F);if(S.F.done)resolve(S);}
 else if(R.phase==='challenge'){const rate=partyOf(S).reduce((s,c)=>s+c.lv*(c.abs.includes(R.need)?1:.15),0);R.prog+=rate;
  if(R.prog>=R.amount){note(S,`${R.cname} passed.`);S.deep=Math.max(S.deep,R.floor);R.floor++;R.enc=0;R.phase='walk';R.walk=CFG.walk;}}}
function advance(S,now){let dt=Math.floor((now-S.last)/1000);if(dt<=0)return null;S.last=now;let away=null;

  S.F=null;if(S.run.phase==='fight'){S.run.phase='walk';S.run.walk=CFG.walk;}S.t+=t;return away;}
 for(let i=0;i<dt;i++)tick(S);return null;}

// ===== commands =====
function descend(S){const R=S.run;if(R.phase!=='home'||!partyOf(S).length)return false;R.floor=S.deep+1;R.enc=0;R.phase='walk';R.walk=1;healAll(S);note(S,`Down to B${R.floor}.`);say(S,'start','Two of you, and a basement. Tap an ability when its gauge fills, or let it fire by itself.');return true;}
function fire(S,id){const F=S.F;if(!F||F.done)return false;const c=F.L.find(x=>x.id===id);if(!c||c.hp<=0||c.gauge<100)return false;special(F,c,c.abs[0],F.L,F.R);settle(F);if(F.done)resolve(S);return true;}
function focus(S,id){if(!S.F)return false;S.F.focus=S.F.focus===id?null:id;return true;}
function hold(S,id){const c=byId(S,id);if(!c)return false;c.hold=!c.hold;return true;}
function levelUp(S,id){const c=byId(S,id);if(!c)return false;const cost=lvCost(c.lv);if(S.gold<cost)return false;S.gold-=cost;c.lv++;restat(c);return true;}

function retreat(S){if(S.run.phase==='home'||S.run.phase==='done')return false;S.F=null;S.run.phase='home';healAll(S);note(S,'Back upstairs.');return true;}

// ===== save =====
function save(S){const o=Object.assign({},S);delete o.F;return JSON.stringify(o);}
function load(json){const S=JSON.parse(json);if(S.v!==4)return null;S.roster.forEach(c=>{const hp=c.hp;restat(c);c.hp=hp;});if(S.run.phase==='fight'){S.run.phase='walk';S.run.walk=CFG.walk;}return S;}
if(typeof module!=='undefined')module.exports={AFF,FEEDS,QUELLS,STATS,SP,ABIL,CFG,bounty,lvCost,rngOf,interval,make,restat,newFight,step,settle,special,alive,floorPlan,stratum,newGame,byId,partyOf,benched,benchRate,farmRate,advance,tick,descend,fire,focus,hold,levelUp,setParty,swap,retreat,save,load};

 if(R.phase==='done')return `<span class="small">B99 cleared.</span><button data-act="new">Start over</button>`;return `<span class="small">${esc(encLabel())}</span><button data-act="retreat">Retreat</button>`;}
function render(){document.getElementById('app').innerHTML=`<header class="mast"><div><h1>Ninety-Nine</h1><div class="sub">the basement · deepest B${S.deep}</div><div class="gold">${g(S.gold)} <small>G</small></div></div><div class="floorno">${S.run.phase==='home'||S.run.phase==='done'?'B'+S.deep:'B'+S.run.floor}<small>of 99</small></div></header>
 ${S.hoz?`<div class="hoz">${hozukiSVG}<div><div class="kick">Hōzuki, the shop lantern</div><p>${esc(S.hoz.text)}</p></div></div>`:''}${floorBox()}${rosterBox()}${ledger()}`;
 document.getElementById('bottom').innerHTML=`<div class="wrap">${bottomBar()}</div>`;document.getElementById('modal').innerHTML=UI.modal?`<div class="modal"><div>${UI.modal}</div></div>`:'';}
function stamp(text,cls){const s=document.getElementById('stamp');if(!s)return;s.textContent=text;s.className='stamp '+(cls||'');void s.offsetWidth;s.classList.add('show');}
function fx(added){let big=null;for(const o of added){if(o.k==='special')big=[ABIL[o.ab].sfx,'red big'];else if(o.k==='hit'&&o.crit)big=big||[SFX.crit,'red big'];else if(o.k==='hit'&&!big)big=[SFX[o.who.aff],''];else if(o.k==='toll'&&!big)big=[SFX.toll,''];
  if(o.tgt){const el=document.getElementById('f-'+o.tgt.id);if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');}}}
 if(S.stats.tamed>UI.tamed)big=[SFX.tame,'red big'];if(S.stats.falls>UI.falls)big=[SFX.fall,'red big'];if(S.deep>UI.deep&&!big)big=[SFX.pass,''];UI.tamed=S.stats.tamed;UI.falls=S.stats.falls;UI.deep=S.deep;if(big)stamp(big[0],big[1]);}
function after(){ // render, then stamps for whatever the fight log added since last time
 const F=S.F;let added=[];if(F){added=F===UI.lastF?F.log.slice(UI.lastLen):F.log.slice();UI.lastF=F;UI.lastLen=F.log.length;}else{UI.lastF=null;UI.lastLen=0;}render();fx(added);}
function loop(){const now=Date.now();if(UI.speed===1)advance(S,now);else{S.last=now;for(let i=0;i<UI.speed;i++)tick(S);}after();if(S.t%5===0)persist();}
function persist(){try{localStorage.setItem(KEY,save(S));}catch(e){}}
function boot(){let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}S=(raw&&load(raw))||newGame(null,Date.now());const away=advance(S,Date.now());UI.tamed=S.stats.tamed;UI.falls=S.stats.falls;UI.deep=S.deep;if(away)UI.modal=awayCard(away);
 if(!S.seen.hello)say(S,'hello','You\'re late. Ninety-nine floors of basement, and everything down there is waking up angry. Take Pochi and Momo and start at the top.');render();setInterval(loop,1000);}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('[data-dbg]'))UI.dbg=e.target.open;},true);
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
 if(act==='descend')descend(S);else if(act==='retreat')retreat(S);else if(act==='fire'){if(fire(S,id)){after();return;}}
 else if(act==='focus')focus(S,id);else if(act==='hold')hold(S,id);else if(act==='level')levelUp(S,id);
 else if(act==='line')swap(S,id,S.party.length);else if(act==='bench')swap(S,id,-1);else if(act==='up')swap(S,id,Math.max(0,S.party.indexOf(id)-1));
 else if(act==='close')UI.modal=null;else if(act==='speed'){UI.speed=UI.speed===1?4:UI.speed===4?16:1;}
 else if(act==='skip'){const away=advance(S,S.last+(+a.dataset.s)*1000);if(away)UI.modal=awayCard(away);}else if(act==='gold')S.gold+=500;
 else if(act==='new'){if(confirm('Start over? The basement forgets everything.')){S=newGame(null,Date.now());persist();}}
 render();persist();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();});addEventListener('pagehide',persist);
boot();
</script></body></html>
