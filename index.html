<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe4c9">
<title>Yorishiro Weekly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Oswald:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a single newsprint column with a masthead, section tabs, and dense bordered boxes like a 1950s shopper. Single theme on purpose: the page is the paper. */
:root{
  --paper:#efe4c9; --paper2:#f6eedc; --ink:#1c1915; --ink2:#4a4239; --muted:#7a7064; --red:#c8362b;
  --ember:#c8362b; --frost:#4e9fd1; --bloom:#4f8f3a; --clay:#c28a2c; --tide:#2b3f8c; --none:#8a6fb5;
  --fd:'Rye',Georgia,serif; --fh:'Oswald','Arial Narrow',Arial,sans-serif; --fb:'Libre Baskerville',Georgia,serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;
  background-image:radial-gradient(rgba(28,25,21,.07) 1px,transparent 1.2px);background-size:5px 5px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
*{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:12px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);padding:5px 10px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper2)}
button.pri{background:var(--ink);color:var(--paper2)} button.pri:hover{background:var(--red);border-color:var(--red)}
button.red{border-color:var(--red);color:var(--red)} button.red:hover{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed} button:disabled:hover{background:var(--paper2);color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
select,textarea{font-family:var(--fh);font-size:13px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);padding:4px 6px;max-width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%}
.wrap{max-width:1040px;margin:0 auto}
.mast{border-top:4px solid var(--ink);border-bottom:2px solid var(--ink);padding:8px 0 6px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px}
.mast h1{font-family:var(--fd);font-size:clamp(30px,7vw,60px);line-height:1;letter-spacing:.02em}
.mast .sub{font-family:var(--fh);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ink2)}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:2px solid var(--ink);padding:6px 0;font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.strip b{font-size:16px;font-variant-numeric:tabular-nums}
.strip .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:4px double var(--ink)}
.tabs button{border:0;border-right:1px solid var(--ink);background:none;padding:8px 12px;font-size:12px}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--ink);color:var(--paper2)}
.view{padding-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.box{border:2px solid var(--ink);background:var(--paper2);padding:10px 12px;min-width:0;position:relative}
.box.dbl{outline:1px solid var(--ink);outline-offset:3px}
.kick{font-family:var(--fh);text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--ink2)}
.hl{font-family:var(--fh);font-weight:600;text-transform:uppercase;font-size:20px;line-height:1.05;letter-spacing:.01em;margin:2px 0 6px}
.hl.big{font-size:26px}
.copy{font-style:italic;color:var(--ink2);margin:4px 0 8px}
.hint{font-size:12px;color:var(--ink2);margin:0 0 8px}
.hint:before{content:"Overheard: ";font-family:var(--fh);text-transform:uppercase;letter-spacing:.1em;font-style:normal;font-size:10px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.bd{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1.5px solid var(--ink);padding:2px 7px;background:var(--paper2);white-space:nowrap}
.bd.met{background:var(--ink);color:var(--paper2)} .bd.short{border-color:var(--red);color:var(--red);text-decoration:line-through}
.bd.aff{border-left-width:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.price{font-family:var(--fh);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.stamp{font-family:var(--fh);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--red);border:3px solid var(--red);padding:2px 8px;transform:rotate(-4deg);display:inline-block;font-size:12px}
.burst{font-family:var(--fh);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em;background:var(--red);color:#fff;padding:3px 8px;clip-path:polygon(50% 0%,61% 12%,78% 5%,80% 22%,97% 25%,89% 40%,100% 50%,89% 60%,97% 75%,80% 78%,78% 95%,61% 88%,50% 100%,39% 88%,22% 95%,20% 78%,3% 75%,11% 60%,0% 50%,11% 40%,3% 25%,20% 22%,22% 5%,39% 12%);padding:10px 12px}
.muted{color:var(--muted)}
.strip2{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.strip2.aff{grid-template-columns:repeat(5,1fr)}
.cell{text-align:center;border:1px solid var(--ink);padding:3px 2px;line-height:1.05;min-width:0}
.cell .k{font-family:var(--fh);text-transform:uppercase;font-size:9px;letter-spacing:.06em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .g{font-family:var(--fh);font-weight:600;font-size:18px}
.cell .g small{font-size:11px;font-weight:400;color:var(--muted)}
.cell{cursor:help}
.cell.cap0{opacity:.35}
.cell.str .g{color:var(--red)}
.cell.aff{border-top:4px solid var(--ink)}
.therm{display:flex;gap:2px;margin:4px 0}
.therm i{flex:1;height:8px;border:1px solid var(--ink);background:var(--paper2)} .therm i.on{background:var(--ink)} .therm i.hot{background:var(--red)}
.punch{display:flex;gap:4px} .punch i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block} .punch i.used{background:var(--ink)}
.cre{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.cre svg{width:72px;height:72px;display:block}
.diary{border-top:1px dashed var(--ink);margin-top:8px;padding-top:6px;font-size:12px;color:var(--ink2)}
.diary div:before{content:"✦ "}
.log{font-size:12px;max-height:320px;overflow:auto;border:1px solid var(--ink);padding:6px 8px;background:var(--paper2)}
.log div{padding:2px 0;border-bottom:1px dotted #bbb}
.log b{font-family:var(--fh);font-weight:400;color:var(--muted);margin-right:6px}
.form{display:grid;grid-template-columns:1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ink2)}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border-top:2px dashed var(--ink);margin-top:8px;padding-top:6px}
.receipt div{display:flex;justify-content:space-between}
.receipt .tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:4px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:8px 14px;border:2px solid var(--paper2);max-width:90vw;z-index:9}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel button.on{background:var(--ink);color:var(--paper2)}
.rel{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);border-left:3px solid var(--red);padding-left:8px;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.box.new{animation:pop .25s ease-out}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div><h1>Yorishiro Weekly</h1><div class="sub">The circular of the vessel shop on Minato Street · bodies for spirits, made to order</div></div>
  </header>
  <div class="strip" id="strip"></div>
  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script id="engine">
// ===== ENGINE (no DOM) =====
const GR=['E','D','C','B','A','S'];
const gradeOf=v=>GR[Math.max(0,Math.min(5,Math.floor(v/10)))];
const gi=g=>GR.indexOf(g), bandBot=g=>gi(g)*10, bandTop=g=>gi(g)*10+9;
const STATS=['Brawn','Grit','Heart','Pace','Wits','Knack'];
const AFF=['Ember','Frost','Bloom','Clay','Tide'];
const FEEDS={Bloom:'Ember',Ember:'Clay',Clay:'Frost',Frost:'Tide',Tide:'Bloom'};
const QUELLS={Ember:'Frost',Frost:'Bloom',Bloom:'Clay',Clay:'Tide',Tide:'Ember'};
const COLOR={Ember:'#c8362b',Frost:'#4e9fd1',Bloom:'#4f8f3a',Clay:'#c28a2c',Tide:'#2b3f8c',none:'#8a6fb5'};
let CONFIG={gold:200,toxCap:100,sessionPts:4,mundanePts:3,expPerIssue:5,outgrow1:40,outgrow2:100,transferKeep:0.7,maxActive:4,newPerIssue:1,trialGain:4,spiritPrice:25,cooldown:6,tier2Rep:3,sessionsFastPace:30};
const NAMES=['Pochi','Tama','Kuro','Momo','Chibi','Goro','Yuki','Kin','Fuku','Hachi','Mame','Nene','Suzu','Taro','Ume'];

const FAM={
 candle:{name:['Candle','Lantern'],native:'Ember',lean:['Grit','Wits'],tags:['glows','warms','guides'],gift:'guides',giftText:'lights the way home for the lost',vice:'gutters in a draft',triggers:['drafty','steamy']},
 chime:{name:['Chime','Bell'],native:'Frost',lean:['Wits','Heart'],tags:['rings','wards','cools'],gift:'warns',giftText:'rings before trouble arrives',vice:'cannot keep quiet',triggers:['quiet']},
 whisk:{name:['Whisk','Broom'],native:'Bloom',lean:['Pace','Knack'],tags:['sweeps','cleans','airs'],gift:'luck',giftText:'sweeps ill luck out with the dust',vice:'sweeps up what you wanted kept',triggers:['smallgoods']},
 teapot:{name:['Teapot','Clay pot'],native:'Clay',lean:['Knack','Grit'],tags:['holds','warms','pours','cooks'],gift:'warms',giftText:'warms the milk and the mood',vice:'whistles at night',triggers:['quiet']},
 ladle:{name:['Ladle','Bucket'],native:'Tide',lean:['Brawn','Pace'],tags:['holds','washes','carries'],gift:'soothes',giftText:'hums a washing song',vice:'splashes',triggers:['paper']},
 kokeshi:{name:['Kokeshi','Doll'],native:null,lean:['Heart'],tags:['comforts','watches','sits'],gift:'watches',giftText:'keeps watch and turns bad dreams away',vice:'sulks when left alone',triggers:['away']},
};
const TIER={1:{size:'small',mat:1,leanF:10,leanC:39,otherF:0,otherC:29,natF:10,natC:29,price:25},2:{size:'medium',mat:2,leanF:20,leanC:49,otherF:10,otherC:39,natF:20,natC:39,price:70}};
const MATS={wax:{n:'Ember wax',a:'Ember',g:'D',p:12},charcoal:{n:'Charcoal',a:'Ember',g:'C',p:28},slag:{n:'Kiln slag',a:'Ember',g:'B',rare:1},
 ice:{n:'River ice',a:'Frost',g:'D',p:10},iron:{n:'Iron shavings',a:'Frost',g:'C',p:30},moonsilver:{n:'Moon silver',a:'Frost',g:'B',rare:1},
 straw:{n:'Rice straw',a:'Bloom',g:'D',p:8},cedar:{n:'Cedar shavings',a:'Bloom',g:'C',p:22},moss:{n:'Old moss',a:'Bloom',g:'B',rare:1},
 earth:{n:'Red earth',a:'Clay',g:'D',p:10},shard:{n:'Fired shard',a:'Clay',g:'C',p:26},brick:{n:'Kiln brick',a:'Clay',g:'B',rare:1},
 water:{n:'Well water',a:'Tide',g:'D',p:8},pearl:{n:'River pearl',a:'Tide',g:'C',p:32},salt:{n:'Deep salt',a:'Tide',g:'B',rare:1}};
const MIX={ash:{n:'Ash insulator',p:40,rule:'mute',text:'mutes every quell in the vessel'},lacing:{n:'Extra lacing',p:35,rule:'slot',text:'+1 material slot'},gold:{n:'Gold leaf',p:45,rule:'cap',text:'+1 band on the native affinity cap'}};
// side: {k:'stat'|'temper'|'mood', key, amt}
const FOODS={pepper:{n:'Fire pepper',g:'C',v:6,to:['aff','Ember'],side:{k:'temper',amt:4},tox:12,p:10},
 riceball:{n:'Rice ball',g:'D',v:5,to:['stat','Grit'],side:{k:'stat',key:'Pace',amt:-2},tox:8,p:6},
 fish:{n:'Dried fish',g:'C',v:6,to:['stat','Brawn'],side:{k:'stat',key:'Wits',amt:-3},tox:10,p:9},
 plum:{n:'Pickled plum',g:'C',v:6,to:['stat','Wits'],side:{k:'stat',key:'Brawn',amt:-3},tox:10,p:9},
 beans:{n:'Sweet beans',g:'D',v:5,to:['stat','Heart'],side:{k:'mood',amt:4},tox:8,p:7},
 milk:{n:'Warm milk',g:'D',v:5,to:['stat','Heart'],side:{k:'mood',amt:-3},tox:8,p:7},
 tofu:{n:'Chilled tofu',g:'C',v:6,to:['aff','Frost'],side:{k:'mood',amt:-4},tox:10,p:9},
 honey:{n:'Mountain honey',g:'B',v:7,to:['aff','Bloom'],side:{k:'temper',amt:-4},tox:16,p:20,rep:2},
 sake:{n:'Spirit sake',g:'A',v:8,to:['stat','Knack'],side:null,tox:20,rare:1}};
const STB={hibachi:{n:'Hibachi',fam:'Hearth',trains:['Ember','Grit'],cap:29,mund:9,owned:1},
 basin:{n:'Basin',fam:'Washtub',trains:['Tide','Brawn'],cap:29,mund:9,env:{k:'mood',amt:-2},owned:1},
 yard:{n:'Yard',fam:'Courtyard',trains:['Pace'],cap:19,mund:19,fixed:1,owned:1},
 planter:{n:'Planter',fam:'Garden',trains:['Bloom','Heart'],cap:29,mund:9,env:{k:'temper',amt:-2},p:80},
 bench:{n:'Workbench',fam:'Bench',trains:['Clay','Knack'],cap:29,mund:9,p:80,rep:2},
 icechest:{n:'Ice chest',fam:'Icebox',trains:['Frost','Wits'],cap:29,mund:9,p:90,rep:4}};
const LOCS={river:{n:'Riverbank Shallows',lvl:'C',trials:[['Pace',12,'mat:cedar'],['Wits',14,'mat:pearl'],['Brawn',16,'mat:charcoal'],['Grit',20,'mat:salt']]},
 kiln:{n:'Old Kiln Hill',lvl:'B',rep:3,trials:[['Grit',24,'mat:shard'],['Knack',26,'mat:brick'],['Heart',28,'food:sake'],['Wits',32,'mat:moonsilver']]}};
const CUST={koda:{n:'Kōda',t:'baker, Kōda Pan'},tokiwa:{n:'Mrs. Tokiwa',t:'the widow upstairs'},umeda:{n:'Umeda',t:'fishmonger'},shiraishi:{n:'Shiraishi',t:'bathhouse, Tsuru-no-yu'},noguchi:{n:'Noguchi',t:'schoolteacher'},hana:{n:'Hana',t:'delivery girl'}};
const SIT={drafty:'drafty',steamy:'steam everywhere',quiet:'needs quiet',smallgoods:'small goods about',paper:'paper and radios about',away:'owner away all day',rough:'rough use'};
const REQS=[
 {id:'r1',c:'koda',title:'OVEN GOES COLD BY DAWN',text:'Two hundred degrees at midnight, stone cold by five. Something small enough for the nook by the flue. My daughter helps in the mornings, so nothing that bites.',cons:[['aff','Ember','C'],['size','small'],['temper','Docile']],pay:90,due:4,desire:'warms',hint:'Mie has warm milk before bed.',sit:'drafty',bonus:'food:honey'},
 {id:'r2',c:'umeda',title:'CATCH SPOILS BY NOON',text:'The ice merchant wants the moon for a block. I need something that keeps a tub cold till the lunch rush. While supplies last, hah.',cons:[['aff','Frost','C'],['tag','holds']],pay:110,due:3,desire:'soothes',hint:'The shop cat naps on the counter.',sit:'quiet',bonus:'mat:pearl'},
 {id:'r3',c:'tokiwa',title:'COMPANY FOR THE LONG NIGHTS',text:'Something to sit with me after the radio goes off. Small, and quiet, dear. I can pay a little, and there are always pickles.',cons:[['stat','Heart','C'],['mood','Quiet'],['size','small']],pay:60,due:6,desire:'guides',hint:'She lights a candle for her husband every night.',sit:'quiet',bonus:'food:sake'},
 {id:'r4',c:'shiraishi',title:'FLOORS STICKY BY EVENING',text:'Steam, soap, forty pairs of feet. I want it clean before the night crowd. Quick.',cons:[['tag','cleans'],['stat','Pace','C']],pay:80,due:3,desire:'luck',hint:'Her regulars say the place has had a bad run.',sit:null,bonus:'mat:cedar'},
 {id:'r5',c:'noguchi',title:'LIGHT FOR THE WALK HOME',text:'Night classes end at nine. The bridge is unlit and the wind off the river is, I am told, brisk. Something that glows and notices things.',cons:[['tag','glows'],['stat','Wits','C']],pay:75,due:4,desire:'guides',hint:'He keeps losing his glasses.',sit:'drafty',bonus:'mat:charcoal'},
 {id:'r6',c:'hana',title:'CARRY THE MORNING ROUND',text:'Forty bottles, twenty papers, before six. The thing has to carry and it has to keep up. I am not slowing down for it.',cons:[['tag','carries'],['stat','Pace','B'],['stat','Grit','C']],pay:120,due:5,desire:'Lively',hint:'She whistles the whole route.',sit:'rough',bonus:'mat:salt'},
 {id:'r7',c:'shiraishi',title:'BIG BATH GOES LUKEWARM',text:'The fire is out by ten and the bath is tepid by midnight. Keep it hot. Keep it steady. I will pay properly.',cons:[['aff','Ember','B'],['aff','Tide','C'],['temper','Steady']],pay:260,due:8,desire:'Lively',hint:'She loves a lively room.',sit:'steamy',minRep:6,bonus:'mat:slag'},
 {id:'r8',c:'noguchi',title:'KEEP FORTY CHILDREN IN LINE',text:'A bell for the classroom. It must be heard at the back and it must be silent the rest of the hour. I realise the contradiction.',cons:[['tag','rings'],['stat','Wits','B'],['mood','Quiet']],pay:150,due:6,desire:'guides',hint:'Glasses again.',sit:'quiet',minRep:4,bonus:'mat:moonsilver'}];

const band=t=>t<=-5?'Docile':t>=5?'Fierce':'Steady', mband=m=>m<=-5?'Quiet':m>=5?'Lively':'Even';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const matFloor=m=>bandBot(MATS[m].g), matCap=m=>bandTop(GR[Math.min(5,gi(MATS[m].g)+1)]);
const matPrice=(G,m)=>{const M=MATS[m];if(M.rare)return null;if(G.stock.soldout===m)return null;if(G.stock.limited===m&&!G.stock.limitedLeft)return null;return G.stock.special===m?Math.round(M.p*0.6):M.p};

let G=null;
function newGame(){G={issue:1,gold:CONFIG.gold,rep:0,inv:{mat:{wax:1,straw:1,water:1},food:{riceball:2},mix:{}},spirits:{},vessels:{},n:1,
 stations:{},requests:[],sold:[],exped:null,stock:null,log:[],done:{},disc:{},deliveries:0};
 for(const id in STB)G.stations[id]={owned:STB[id].owned?1:0,spiritId:null,used:0};
 const s=newSpirit({temper:-6,mood:-2});G.spirits[s.id]=s;
 rollStock();addRequest('r1');addRequest('r4');log('The shop opens. Two requests on the counter, one spirit in the box.');return G;}
const uid=p=>p+(G.n++);
function log(t){G.log.unshift({i:G.issue,t});if(G.log.length>80)G.log.length=80;}
function newSpirit(o={}){const v={};STATS.concat(AFF).forEach(k=>v[k]=0);return {id:uid('s'),name:o.name||pick(NAMES),v,exp:0,tox:0,temper:o.temper??rnd(-9,9),mood:o.mood??rnd(-9,9),hist:[],vesselId:null,owner:null};}
function rollStock(){const ids=shuffle(Object.keys(MATS).filter(m=>!MATS[m].rare));G.stock={special:ids[0],limited:ids[1],soldout:ids[2],limitedLeft:1,spirits:[0,1,2].map(()=>({name:pick(NAMES),temper:rnd(-9,9),mood:rnd(-9,9)}))};}
function addRequest(id){const t=REQS.find(r=>r.id===id);G.requests.push({...t,uid:uid('q'),due:t.due,cons:t.cons.map(c=>c.slice())});}
function reqAvailable(){const active=new Set(G.requests.map(r=>r.id));return REQS.filter(r=>!active.has(r.id)&&G.rep>=(r.minRep||0)&&(!G.done[r.id]||G.done[r.id]+CONFIG.cooldown<=G.issue));}

// --- vessels ---
function buildVessel(fam,tier,mats,mixes){const F=FAM[fam],T=TIER[tier];const floors={},caps={};
 STATS.forEach(s=>{const l=F.lean.includes(s);floors[s]=l?T.leanF:T.otherF;caps[s]=l?T.leanC:T.otherC;});
 AFF.forEach(a=>{floors[a]=0;caps[a]=9;});
 if(F.native){floors[F.native]=T.natF;caps[F.native]=T.natC;}
 mats.forEach(m=>{const a=MATS[m].a;floors[a]=Math.max(floors[a],matFloor(m));caps[a]=Math.max(caps[a],matCap(m));});
 const mute=mixes.includes('ash');if(mixes.includes('gold')&&F.native)caps[F.native]+=10;
 const present=AFF.filter(a=>floors[a]>0),rel=[];
 present.forEach(a=>present.forEach(b=>{if(FEEDS[a]===b){caps[b]+=10;caps[a]-=10;rel.push(a+' feeds '+b+' (+'+b+' cap, −'+a+' cap)');}
  if(QUELLS[a]===b){if(mute)rel.push(a+' quells '+b+' — muted');else{caps[a]-=10;caps[b]-=10;rel.push(a+' quells '+b+' (both caps −1 band)');}}}));
 AFF.forEach(a=>{caps[a]=Math.max(0,Math.min(59,caps[a]));floors[a]=Math.min(floors[a],caps[a]);});
 return {id:null,kind:'creature',fam,tier,size:T.size,tags:F.tags,floors,caps,mats:mats.slice(),mix:mixes.slice(),rel,spiritId:null,name:F.name[tier-1]};}
function orderCost(fam,tier,mats,mixes,spiritChoice){let items=[['Mold: '+FAM[fam].name[tier-1],TIER[tier].price]];const owned={...G.inv.mat},ownedMix={...G.inv.mix};
 for(const m of mats){if(owned[m]>0){owned[m]--;items.push([MATS[m].n+' (owned)',0]);}else{const p=matPrice(G,m);if(p==null)return {err:MATS[m].n+' is not available'};items.push([MATS[m].n,p]);}}
 for(const x of mixes){if(ownedMix[x]>0){ownedMix[x]--;items.push([MIX[x].n+' (owned)',0]);}else items.push([MIX[x].n,MIX[x].p]);}
 if(spiritChoice&&spiritChoice.startsWith('shop:'))items.push(['Null spirit (shrine)',CONFIG.spiritPrice]);
 return {items,total:items.reduce((s,i)=>s+i[1],0)};}
function placeOrder(fam,tier,mats,mixes,spiritChoice){
 if(tier===2&&G.rep<CONFIG.tier2Rep)return 'Tier-two molds need reputation '+CONFIG.tier2Rep;
 const slots=TIER[tier].mat+(mixes.includes('lacing')?1:0);if(mats.length>slots)return 'Too many materials for this mold';
 const c=orderCost(fam,tier,mats,mixes,spiritChoice);if(c.err)return c.err;if(c.total>G.gold)return 'Not enough gold ('+c.total+'g)';
 G.gold-=c.total;
 for(const m of mats){if(G.inv.mat[m]>0)G.inv.mat[m]--;else if(G.stock.limited===m)G.stock.limitedLeft=0;}
 for(const x of mixes){if(G.inv.mix[x]>0)G.inv.mix[x]--;}
 const v=buildVessel(fam,tier,mats,mixes);v.id=uid('v');G.vessels[v.id]=v;
 let sp=null;if(spiritChoice&&spiritChoice.startsWith('shop:')){const st=G.stock.spirits[+spiritChoice.slice(5)];sp=newSpirit(st);G.spirits[sp.id]=sp;G.stock.spirits.splice(+spiritChoice.slice(5),1);}
 else if(spiritChoice)sp=G.spirits[spiritChoice];
 if(sp)possess(v,sp);
 log('Made a '+v.name+(sp?' and '+sp.name+' moved in.':' (empty).')+' Cost '+c.total+'g.');return null;}
function possess(v,s){STATS.concat(AFF).forEach(k=>{s.v[k]=Math.max(s.v[k],v.floors[k]);});v.spiritId=s.id;s.vesselId=v.id;s.hist.push('Issue '+G.issue+': took the '+v.name+' as a body.');}
function spiritOf(v){return v&&v.spiritId?G.spirits[v.spiritId]:null;}
const effVal=(v,s,k)=>Math.min(s.v[k],v.caps[k]);
const straining=(v,s)=>STATS.concat(AFF).some(k=>s.v[k]>v.caps[k]);
function transferOut(vid){const v=G.vessels[vid],s=spiritOf(v);if(!s)return 'Empty';s.exp=Math.floor(s.exp*CONFIG.transferKeep);s.vesselId=null;v.spiritId=null;s.hist.push('Issue '+G.issue+': left the '+v.name+'.');log(s.name+' left the '+v.name+'; exp trimmed to '+s.exp+'.');return null;}
function salvage(vid){const v=G.vessels[vid];if(v.spiritId)return 'Still possessed';delete G.vessels[vid];if(v.mats.length){const m=pick(v.mats);G.inv.mat[m]=(G.inv.mat[m]||0)+1;log('Salvaged the '+v.name+': '+MATS[m].n+' recovered.');}else log('Salvaged the '+v.name+'. Nothing came back.');return null;}
function roster(){return Object.values(G.vessels).filter(v=>v.spiritId&&!(G.exped&&G.exped.vesselId===v.id));}
function boxSpirits(){return Object.values(G.spirits).filter(s=>!s.vesselId&&!s.owner);}
function emptyVessels(){return Object.values(G.vessels).filter(v=>!v.spiritId);}
function possessEmpty(vid,sid){const v=G.vessels[vid],s=G.spirits[sid];if(v.spiritId||s.vesselId)return 'No';possess(v,s);log(s.name+' moved into the '+v.name+'.');return null;}

// --- feeding ---
function feedPreview(vid,fid){const v=G.vessels[vid],s=spiritOf(v),F=FOODS[fid];if(!s)return {err:'Empty'};const [kind,key]=F.to;const cur=s.v[key];
 const above=Math.max(0,gi(gradeOf(cur))-gi(F.g));let gain=Math.floor(F.v/Math.pow(2,above));const capped=Math.max(0,Math.min(gain,v.caps[key]-cur));
 return {key,cur,gain,capped,above,toxAfter:s.tox+F.tox,ok:s.tox+F.tox<=CONFIG.toxCap,side:F.side};}
function feed(vid,fid){if(!(G.inv.food[fid]>0))return 'None in the pantry';const p=feedPreview(vid,fid);if(p.err)return p.err;if(!p.ok)return 'Toxicity would pass '+CONFIG.toxCap;
 const v=G.vessels[vid],s=spiritOf(v),F=FOODS[fid];G.inv.food[fid]--;s.v[p.key]+=p.capped;s.tox+=F.tox;applySide(s,F.side);
 s.hist.push('Issue '+G.issue+': ate '+F.n+' (+'+p.capped+' '+p.key+').');log(s.name+' ate '+F.n+': +'+p.capped+' '+p.key+(p.above?' (diminished)':'')+', toxicity '+s.tox+'.');return null;}
function applySide(s,side){if(!side)return;if(side.k==='stat')s.v[side.key]=Math.max(0,s.v[side.key]+side.amt);else if(side.k==='temper')s.temper=Math.max(-15,Math.min(15,s.temper+side.amt));else if(side.k==='mood')s.mood=Math.max(-15,Math.min(15,s.mood+side.amt));}

// --- stations & training ---
function stationInfo(id){const S=STB[id],st=G.stations[id],sp=st.spiritId?G.spirits[st.spiritId]:null;const ceil={},pts=S.fixed||!sp?CONFIG.mundanePts:CONFIG.sessionPts+Math.floor(sp.v.Knack/10);
 S.trains.forEach(k=>ceil[k]=S.fixed||!sp?S.mund:bandTop(gradeOf(Math.min(sp.v[k],S.cap))));
 const sessions=sp&&sp.v.Pace>=CONFIG.sessionsFastPace?2:1;return {S,st,sp,ceil,pts,sessions};}
function trainPreview(id,vid,key){const I=stationInfo(id),v=G.vessels[vid],s=spiritOf(v);if(!s)return {err:'Empty'};if(!I.S.trains.includes(key))return {err:'This station does not train '+key};
 if(I.st.used>=I.sessions)return {err:'No sessions left today'};const cur=s.v[key];const gain=Math.max(0,Math.min(I.pts,I.ceil[key]-cur,v.caps[key]-cur));
 return {gain,cur,ceil:I.ceil[key],cap:v.caps[key],pts:I.pts,env:I.S.env};}
function train(id,vid,key){const p=trainPreview(id,vid,key);if(p.err)return p.err;if(p.gain<=0)return p.cur>=p.ceil?'At this station\'s ceiling ('+gradeOf(p.ceil)+')':'At the vessel\'s cap';
 const v=G.vessels[vid],s=spiritOf(v);s.v[key]+=p.gain;G.stations[id].used++;applySide(s,p.env);s.hist.push('Issue '+G.issue+': trained '+key+' at the '+STB[id].n+' (+'+p.gain+').');log(s.name+' trained '+key+' +'+p.gain+' at the '+STB[id].n+'.');return null;}
function possessStation(id,vid){const S=STB[id],st=G.stations[id];if(S.fixed)return 'Nothing can possess the yard';if(!st.owned)return 'Not owned';const v=G.vessels[vid],s=spiritOf(v);if(!s)return 'Empty';
 if(st.spiritId)releaseStation(id);const e=transferOut(vid);if(e)return e;st.spiritId=s.id;s.vesselId='station:'+id;s.hist.push('Issue '+G.issue+': possessed the '+S.n+'.');log(s.name+' now tends the '+S.n+'.');return null;}
function releaseStation(id){const st=G.stations[id];if(!st.spiritId)return;const s=G.spirits[st.spiritId];s.vesselId=null;st.spiritId=null;log(s.name+' left the '+STB[id].n+'.');}
function buyStation(id){const S=STB[id],st=G.stations[id];if(st.owned)return 'Owned';if(G.rep<(S.rep||0))return 'Needs reputation '+S.rep;if(G.gold<S.p)return 'Not enough gold';G.gold-=S.p;st.owned=1;log('Bought a '+S.n+'.');return null;}

// --- shop ---
function buyMat(m){const p=matPrice(G,m);if(p==null)return 'Not available';if(G.gold<p)return 'Not enough gold';G.gold-=p;G.inv.mat[m]=(G.inv.mat[m]||0)+1;if(G.stock.limited===m)G.stock.limitedLeft=0;return null;}
function buyFood(f){const F=FOODS[f];if(F.rare)return 'Not for sale';if(G.rep<(F.rep||0))return 'Needs reputation '+F.rep;if(G.gold<F.p)return 'Not enough gold';G.gold-=F.p;G.inv.food[f]=(G.inv.food[f]||0)+1;return null;}
function buyMix(x){if(G.gold<MIX[x].p)return 'Not enough gold';G.gold-=MIX[x].p;G.inv.mix[x]=(G.inv.mix[x]||0)+1;return null;}
function buySpirit(i){const st=G.stock.spirits[i];if(!st)return 'Gone';if(G.gold<CONFIG.spiritPrice)return 'Not enough gold';G.gold-=CONFIG.spiritPrice;const s=newSpirit(st);G.spirits[s.id]=s;G.stock.spirits.splice(i,1);log('Bought '+s.name+' from the shrine.');return null;}
function grantItem(code){if(!code)return '';const [k,id]=code.split(':');if(k==='mat'){G.inv.mat[id]=(G.inv.mat[id]||0)+1;return MATS[id].n;}if(k==='food'){G.inv.food[id]=(G.inv.food[id]||0)+1;return FOODS[id].n;}return '';}

// --- requests ---
function fit(req,v){const s=spiritOf(v);return req.cons.map(c=>{const [t,k,g]=c;let ok=false;
 if(t==='aff'||t==='stat')ok=effVal(v,s,k)>=bandBot(g);else if(t==='size')ok=v.size===k;else if(t==='tag')ok=v.tags.includes(k);else if(t==='species')ok=v.fam===k;
 else if(t==='temper')ok=band(s.temper)===k;else if(t==='mood')ok=mband(s.mood)===k;
 if(req.spiritReq&&v.spiritId!==req.spiritReq)ok=ok&&false;return {c,ok};});}
function conText(c){const [t,k,g]=c;if(t==='aff'||t==='stat')return k.toUpperCase()+' ≥ '+g;return k.toUpperCase();}
function deliver(quid,vid){const r=G.requests.find(q=>q.uid===quid),v=G.vessels[vid],s=spiritOf(v);if(!r||!s)return 'No';
 if(r.spiritReq&&v.spiritId!==r.spiritReq)return 'This customer wants their own spirit back';
 const f=fit(r,v);if(f.some(x=>!x.ok))return 'DECLINED — '+conText(f.find(x=>!x.ok).c)+' short';
 const F=FAM[v.fam];G.gold+=r.pay;G.rep+=1;G.deliveries++;let msg=CUST[r.c].n+' takes the '+v.name+' ('+s.name+'). +'+r.pay+'g, +1 rep.';
 const bonus=r.desire&&(F.gift===r.desire||mband(s.mood)===r.desire||band(s.temper)===r.desire);
 if(bonus){G.rep+=2;const g=grantItem(r.bonus);msg+=' BONUS: the '+(F.gift===r.desire?'gift':'temperament')+' fit. +2 rep'+(g?', '+g:'')+'.';}
 if(r.sit&&F.triggers.includes(r.sit)){G.rep-=1;msg+=' Complaint within the week: it '+F.vice+'. −1 rep.';}
 s.owner=r.c;s.vesselId='sold';s.hist.push('Issue '+G.issue+': went to work for '+CUST[r.c].n+'.');
 G.sold.push({spiritId:s.id,vname:v.name,fam:v.fam,tier:v.tier,c:r.c,cons:r.cons,pay:r.pay,issue:G.issue});
 delete G.vessels[vid];G.requests=G.requests.filter(q=>q.uid!==quid);G.done[r.id]=G.issue;log(msg);return null;}
function accept(quid){const r=G.requests.find(q=>q.uid===quid);if(r){r.accepted=1;log('Accepted '+r.title+'. No deadline while you work on it.');}}
function decline(quid){const r=G.requests.find(q=>q.uid===quid);G.requests=G.requests.filter(q=>q.uid!==quid);G.rep-=1;G.done[r.id]=G.issue;log('Declined '+r.title+'. −1 rep.');}
function bumpCons(cons){const out=cons.filter(c=>c[0]!=='size').map(c=>c.slice());const i=out.findIndex(c=>c[0]==='aff'||c[0]==='stat');if(i>=0)out[i][2]=GR[Math.min(5,gi(out[i][2])+1)];return out;}
function checkOutgrow(){for(const so of G.sold.slice()){const s=G.spirits[so.spiritId];s.exp+=CONFIG.expPerIssue;const th=so.tier===1?CONFIG.outgrow1:CONFIG.outgrow2;
 if(s.exp>=th){G.sold=G.sold.filter(x=>x!==so);s.vesselId=null;s.owner=null;s.exp=Math.floor(s.exp*CONFIG.transferKeep);s.hist.push('Issue '+G.issue+': outgrew the '+so.vname+' and came home.');
  G.requests.push({id:'u:'+so.spiritId,uid:uid('q'),c:so.c,title:'UPGRADE: '+s.name.toUpperCase()+' HAS OUTGROWN THE '+so.vname.toUpperCase(),text:'It cracked the thing clean through. It is sitting in your box now. Same spirit, bigger body, please.',cons:bumpCons(so.cons),pay:Math.round(so.pay*1.5),due:6,desire:null,hint:'The spirit remembers the house.',sit:null,spiritReq:s.id,kind:'upgrade'});
  log(CUST[so.c].n+' is back: '+s.name+' outgrew the '+so.vname+'.');}}}

// --- expeditions ---
function send(vid,loc){if(G.exped)return 'One expedition at a time';const L=LOCS[loc];if(G.rep<(L.rep||0))return 'Needs reputation '+L.rep;const v=G.vessels[vid];if(!spiritOf(v))return 'Empty';G.exped={vesselId:vid,loc,step:0,haul:[],await:false};log(spiritOf(v).name+' set out for '+L.n+'.');return null;}
function pressOn(){if(G.exped)G.exped.await=false;}
function returnHome(){const e=G.exped;if(!e)return;e.haul.forEach(grantItem);const v=G.vessels[e.vesselId];log(spiritOf(v).name+' came home from '+LOCS[e.loc].n+' with '+(e.haul.length||'no')+' finds.');G.exped=null;}
function resolveExped(){const e=G.exped;if(!e||e.await)return;const L=LOCS[e.loc],v=G.vessels[e.vesselId],s=spiritOf(v),[stat,th,reward]=L.trials[e.step];
 G.disc[e.loc]=G.disc[e.loc]||{};G.disc[e.loc][e.step]=true;
 if(effVal(v,s,stat)>=th){e.haul.push(reward);const gain=Math.max(0,Math.min(CONFIG.trialGain,bandTop(L.lvl)-s.v[stat],v.caps[stat]-s.v[stat]));s.v[stat]+=gain;e.step++;
  s.hist.push('Issue '+G.issue+': passed '+stat+' trial at '+L.n+'.');log(s.name+' passed the '+stat+' trial ('+th+'). +'+gain+' '+stat+'.');
  if(e.step>=L.trials.length){log('Cleared '+L.n+'!');returnHome();}else e.await=true;}
 else{const kept=e.haul.slice(0,Math.floor(e.haul.length/2));kept.forEach(grantItem);s.vesselId=null;delete G.vessels[v.id];
  s.hist.push('Issue '+G.issue+': the '+v.name+' broke at '+L.n+'. Came home bodiless.');log('The '+v.name+' broke on the '+stat+' trial ('+th+'). '+s.name+' is home in the box with '+kept.length+' finds.');G.exped=null;}}

// --- the day ---
function nextIssue(){
 for(const r of G.requests.slice()){if(r.accepted)continue;r.due--;if(r.due<=0){G.requests=G.requests.filter(q=>q!==r);G.rep-=2;G.done[r.id]=G.issue;log('Missed the deadline: '+r.title+'. −2 rep.');}}
 checkOutgrow();resolveExped();G.issue++;for(const id in G.stations)G.stations[id].used=0;rollStock();
 const av=shuffle(reqAvailable());let n=0;while(G.requests.length<CONFIG.maxActive&&n<CONFIG.newPerIssue&&av.length){addRequest(av.shift().id);n++;}
 log('Issue '+G.issue+' goes to press.');}
function exportState(){return JSON.stringify({CONFIG,G});}
function importState(txt){const o=JSON.parse(txt);if(!o.G||!o.G.vessels)throw new Error('bad pickle');CONFIG={...CONFIG,...o.CONFIG};G=o.G;}
if(typeof module!=='undefined')module.exports={newGame,get G(){return G},CONFIG,FAM,MATS,FOODS,STB,LOCS,REQS,buildVessel,placeOrder,feed,feedPreview,train,trainPreview,possessStation,buyMat,buyFood,buySpirit,fit,deliver,accept,nextIssue,send,pressOn,returnHome,roster,boxSpirits,spiritOf,gradeOf,effVal,exportState,importState,checkOutgrow,orderCost};
</script>

<script>
// ===== UI =====
const $=s=>document.querySelector(s);
const TABS=[['front','Front Page'],['order','Order Form'],['specials','Specials'],['workshop','Workshop'],['roster','Roster'],['travel','Travel'],['ledger','Ledger']];
const UI={tab:'front',pick:{},order:{fam:'candle',tier:1,mats:[],mix:'',spirit:''},feed:{vid:'',fid:''},train:{id:'hibachi',vid:'',key:''},poss:{id:'hibachi',vid:''},pe:{vid:'',sid:''},send:{vid:'',loc:'river'},open:{},pickle:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('yw-save',exportState());}catch(e){}}
function load(){try{const t=localStorage.getItem('yw-save');if(t){importState(t);return true;}}catch(e){}return false;}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}
function act(fn){const e=fn();if(e)toast(e);save();render();}

function svgCreature(v,s){const F=FAM[v.fam];const dom=s?AFF.reduce((a,b)=>s.v[b]>s.v[a]?b:a,AFF[0]):null;const col=s&&s.v[dom]>0?COLOR[dom]:COLOR.none;
 const maxv=s?Math.max(...STATS.concat(AFF).map(k=>effVal(v,s,k))):0;const R=REG[v.fam];const lit=s?Math.min(R.length,1+Math.floor(maxv/15)):0;
 const fill=i=>i<lit?col:'#f6eedc';const parts=R.map((p,i)=>p.replace('%F',fill(i)));
 const eyes=s?EYES[v.fam].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#1c1915"/><circle cx="${x+.8}" cy="${y-.8}" r=".8" fill="${col}"/>`).join(''):'';
 const ring=v.tier===2?'<rect x="2" y="2" width="60" height="60" fill="none" stroke="#1c1915" stroke-dasharray="3 3"/>':'';
 return `<svg viewBox="0 0 64 64" stroke="#1c1915" stroke-width="2.2" stroke-linejoin="round">${ring}${parts.join('')}${eyes}</svg>`;}
const REG={candle:['<rect x="16" y="54" width="32" height="6" fill="%F"/>','<rect x="22" y="26" width="20" height="30" rx="3" fill="%F"/>','<ellipse cx="26" cy="30" rx="3" ry="5" fill="%F"/><ellipse cx="38" cy="33" rx="3" ry="6" fill="%F"/>','<path d="M32 6 C25 15 25 20 32 25 C39 20 39 15 32 6 Z" fill="%F"/>'],
 chime:['<path d="M14 36 A18 18 0 0 1 50 36 Z" fill="%F"/>','<rect x="27" y="46" width="10" height="14" fill="%F"/>','<line x1="32" y1="36" x2="32" y2="43"/><circle cx="32" cy="44" r="3.5" fill="%F"/>'],
 whisk:['<rect x="29" y="4" width="6" height="24" fill="%F"/>','<rect x="24" y="28" width="16" height="6" fill="%F"/>','<path d="M20 34 L44 34 L50 58 L14 58 Z" fill="%F"/>'],
 teapot:['<ellipse cx="32" cy="40" rx="18" ry="14" fill="%F"/>','<path d="M14 34 C4 34 4 46 14 46" fill="none"/><ellipse cx="32" cy="26" rx="12" ry="4" fill="%F"/>','<path d="M48 36 L58 26 L60 30 L50 42 Z" fill="%F"/>','<circle cx="32" cy="22" r="3" fill="%F"/>'],
 ladle:['<rect x="30" y="6" width="5" height="30" fill="%F"/>','<path d="M14 36 L50 36 L46 56 L18 56 Z" fill="%F"/>','<rect x="18" y="40" width="28" height="6" fill="%F"/>'],
 kokeshi:['<rect x="22" y="30" width="20" height="28" rx="4" fill="%F"/>','<circle cx="32" cy="18" r="12" fill="%F"/>','<circle cx="26" cy="23" r="2" fill="%F"/><circle cx="38" cy="23" r="2" fill="%F"/>','<circle cx="32" cy="44" r="4" fill="%F"/>']};
const EYES={candle:[[28,40],[36,40]],chime:[[26,28],[38,28]],whisk:[[27,44],[37,44]],teapot:[[26,40],[38,40]],ladle:[[26,48],[38,48]],kokeshi:[[28,17],[36,17]]};

function stripHTML(v,s){const cell=(k,aff)=>{const val=s?effVal(v,s,k):v.floors[k];const str=s&&s.v[k]>v.caps[k];return `<div class="cell ${aff?'aff':''} ${v.caps[k]<10?'cap0':''} ${str?'str':''}" style="${aff?'border-top-color:'+COLOR[k]:''}" title="${k}: ${val} now · floor ${v.floors[k]} · cap ${v.caps[k]} (${gradeOf(v.caps[k])})"><div class="k">${k}</div><div class="g">${gradeOf(val)}<small>/${gradeOf(v.caps[k])}</small></div></div>`;};
 return `<div class="strip2">${STATS.map(k=>cell(k)).join('')}</div><div class="strip2 aff">${AFF.map(k=>cell(k,1)).join('')}</div>`;}
function badge(c,ok){const [t,k]=c;const aff=t==='aff';return `<span class="bd ${ok===true?'met':ok===false?'short':''} ${aff?'aff':''}" style="${aff?'border-left-color:'+COLOR[k]:''}">${conText(c)}</span>`;}
const tempText=s=>`${band(s.temper)} · ${mband(s.mood)}`;
function therm(val,max,hot){const n=10,on=Math.round(val/max*n);return `<div class="therm" title="${val}/${max}">${Array.from({length:n},(_,i)=>`<i class="${i<on?(hot&&i>=7?'hot':'on'):''}"></i>`).join('')}</div>`;}
function creatureCard(v,extra=''){const s=spiritOf(v);const open=UI.open[v.id];return `<div class="box"><div class="cre">${svgCreature(v,s)}<div style="min-width:0"><div class="kick">${FAM[v.fam].name[v.tier-1]} · ${v.size} · ${v.tags.join(', ')}</div><div class="hl">${s?esc(s.name):'Empty vessel'}</div>
 ${s?`<div class="muted" style="font-size:12px">${tempText(s)} · exp ${s.exp}${straining(v,s)?' · <span class="stamp" style="font-size:10px;padding:0 4px">straining</span>':''}</div>`:''}</div></div>
 ${stripHTML(v,s)}${s?`<div class="kick">Toxicity ${s.tox}/${CONFIG.toxCap}</div>${therm(s.tox,CONFIG.toxCap,true)}`:''}
 <div class="rel">${v.rel.length?v.rel.join(' · '):'No pairs in this vessel'}${v.mix.length?' · '+v.mix.map(x=>MIX[x].n).join(', '):''}</div>
 <div class="row" style="margin-top:6px">${extra}${s?`<button data-act="open" data-id="${v.id}">${open?'Close':'Diary'}</button>`:''}</div>
 ${open&&s?`<div class="diary">${s.hist.slice().reverse().map(h=>`<div>${esc(h)}</div>`).join('')||'<div>Nothing yet.</div>'}</div>`:''}</div>`;}

function render(){
 $('#strip').innerHTML=`<span>Issue <b>No. ${G.issue}</b></span><span>Gold <b>${G.gold}g</b></span><span>Reputation <b>${G.rep}</b></span><span>Shelf <b>${roster().length}</b></span><span class="sp"></span><button class="pri" data-act="next">Go to press → next issue</button>`;
 $('#tabs').innerHTML=TABS.map(([id,n])=>`<button class="${UI.tab===id?'on':''}" data-act="tab" data-id="${id}">${n}${id==='front'&&G.requests.length?' ('+G.requests.length+')':''}</button>`).join('');
 $('#view').innerHTML=({front,order,specials,workshop,roster:rosterTab,travel,ledger})[UI.tab]();}

function front(){if(!G.requests.length)return '<div class="box">No requests this issue. Go to press.</div>';
 return `<div class="grid wide">${G.requests.map(r=>{const C=CUST[r.c];const pk=UI.pick[r.uid];return `<div class="box dbl">
 <div class="row sb"><span class="kick">${esc(C.n)} · ${esc(C.t)}</span>${r.accepted?'<span class="kick">accepted · no deadline</span>':`<span class="kick" style="color:${r.due<=1?'var(--red)':''}">due in ${r.due}</span>`}</div>
 <div class="hl">${esc(r.title)}</div><div class="copy">“${esc(r.text)}”</div>${r.hint?`<div class="hint">${esc(r.hint)}</div>`:''}
 <div class="badges">${r.cons.map(c=>badge(c)).join('')}${r.sit?`<span class="bd" style="border-style:dashed">${SIT[r.sit]}</span>`:''}</div>
 <div class="row sb"><span class="price">${r.pay}<small>g + rep</small></span><span class="row"><button data-act="decline" data-id="${r.uid}" class="red">Decline</button>${r.accepted?'':`<button data-act="accept" data-id="${r.uid}">Accept</button>`}<button class="pri" data-act="pick" data-id="${r.uid}">${pk?'Hide':'Deliver…'}</button></span></div>
 ${pk?`<div style="margin-top:8px;border-top:2px dashed var(--ink);padding-top:8px">${roster().map(v=>{const s=spiritOf(v);const f=fit(r,v);const ok=f.every(x=>x.ok);return `<div class="row sb" style="padding:4px 0;border-bottom:1px dotted #aaa"><span><b>${esc(s.name)}</b> the ${v.name}${r.spiritReq&&v.spiritId!==r.spiritReq?' <span class="muted">(not their spirit)</span>':''}</span><span class="badges" style="margin:0">${f.map(x=>badge(x.c,x.ok)).join('')}</span><button class="pri" data-act="deliver" data-id="${r.uid}" data-v="${v.id}" ${ok?'':'disabled'}>Hand over</button></div>`}).join('')||'<span class="muted">Nothing on the shelf.</span>'}</div>`:''}
 </div>`}).join('')}</div>`;}

function order(){const o=UI.order;const T=TIER[o.tier];const slots=T.mat+(o.mix==='lacing'?1:0);o.mats=o.mats.slice(0,slots);
 const prev=buildVessel(o.fam,o.tier,o.mats.filter(Boolean),o.mix?[o.mix]:[]);const cost=orderCost(o.fam,o.tier,o.mats.filter(Boolean),o.mix?[o.mix]:[],o.spirit);
 const matOpt=m=>{const M=MATS[m];const own=G.inv.mat[m]||0;const p=matPrice(G,m);const lab=own?`owned ×${own}`:p==null?(M.rare?'not in stock':G.stock.soldout===m?'SOLD OUT':'SOLD OUT'):p+'g'+(G.stock.special===m?' SPECIAL':'')+(G.stock.limited===m?' LIMIT 1':'');return `<option value="${m}" ${(!own&&p==null)?'disabled':''}>${M.n} — ${M.a} ${M.g} — ${lab}</option>`;};
 const sp=boxSpirits();const spOpt=sp.map(s=>`<option value="${s.id}" ${o.spirit===s.id?'selected':''}>${esc(s.name)} (box) — ${tempText(s)}</option>`).join('')+G.stock.spirits.map((s,i)=>`<option value="shop:${i}" ${o.spirit==='shop:'+i?'selected':''}>${esc(s.name)} (shrine, ${CONFIG.spiritPrice}g) — ${band(s.temper)} · ${mband(s.mood)}</option>`).join('');
 return `<div class="two"><div class="box dbl"><div class="kick">Mail-order coupon · fill in and send</div><div class="hl big">Build your own vessel</div>
 <div class="form">
 <label>Mold <select data-f="fam">${Object.keys(FAM).map(f=>`<option value="${f}" ${o.fam===f?'selected':''}>${FAM[f].name[0]} / ${FAM[f].name[1]} — ${FAM[f].native||'no native'} — ${FAM[f].tags.join(', ')}</option>`).join('')}</select></label>
 <label>Tier <div class="sel"><button data-f="tier" data-v="1" class="${o.tier===1?'on':''}">Small · ${TIER[1].price}g · 1 slot</button><button data-f="tier" data-v="2" class="${o.tier===2?'on':''}" ${G.rep<CONFIG.tier2Rep?'disabled':''}>Medium · ${TIER[2].price}g · 2 slots${G.rep<CONFIG.tier2Rep?' · rep '+CONFIG.tier2Rep:''}</button></div></label>
 ${Array.from({length:slots},(_,i)=>`<label>Material ${i+1} <select data-f="mat" data-i="${i}"><option value="">— none —</option>${Object.keys(MATS).map(m=>matOpt(m).replace('<option ',`<option ${o.mats[i]===m?'selected ':''}`)).join('')}</select></label>`).join('')}
 <label>Mix-in <select data-f="mix"><option value="">— none —</option>${Object.keys(MIX).map(x=>`<option value="${x}" ${o.mix===x?'selected':''}>${MIX[x].n} — ${MIX[x].text} — ${G.inv.mix[x]?'owned ×'+G.inv.mix[x]:MIX[x].p+'g'}</option>`).join('')}</select></label>
 <label>Spirit <select data-f="spirit"><option value="">— leave empty —</option>${spOpt}</select></label>
 </div>
 <div class="receipt">${cost.err?`<div style="color:var(--red)">${cost.err}</div>`:cost.items.map(i=>`<div><span>${esc(i[0])}</span><span>${i[1]}g</span></div>`).join('')+`<div class="tot"><span>TOTAL</span><span>${cost.total}g</span></div>`}</div>
 <div class="row" style="margin-top:8px"><button class="pri" data-act="place" ${cost.err?'disabled':''}>Place order</button><span class="muted">Gold on hand: ${G.gold}g</span></div></div>
 <div class="box"><div class="kick">Artist's rendering · floors and caps before any raising</div><div class="hl">${FAM[o.fam].name[o.tier-1]} · ${T.size}</div>
 <div class="cre">${svgCreature(prev,null)}<div><div class="muted" style="font-size:12px">Gift: ${FAM[o.fam].giftText}. Vice: ${FAM[o.fam].vice} (${FAM[o.fam].triggers.map(t=>SIT[t]).join(', ')}).</div></div></div>
 ${stripHTML(prev,null)}<div class="rel">${prev.rel.length?prev.rel.join(' · '):'No pairs in this vessel'}</div>
 <div class="note">A vessel raises a spirit to its floors, never above. Everything past the floor is feeding, training or expeditions.</div></div></div>`;}

function specials(){const st=G.stock;const tag=m=>st.special===m?'<span class="burst">Special</span>':st.limited===m?'<span class="bd">LIMIT 1</span>':st.soldout===m?'<span class="stamp">Sold out</span>':'';
 return `<div class="box dbl" style="margin-bottom:12px"><div class="row sb"><div><div class="kick">Gokuraku Junk · this issue's specials · while supplies last</div><div class="hl big">Materials</div></div><span class="muted">Pantry: ${Object.entries(G.inv.mat).filter(([k,n])=>n>0).map(([k,n])=>MATS[k].n+' ×'+n).join(', ')||'empty'}</span></div>
 <div class="grid">${Object.keys(MATS).map(m=>{const M=MATS[m];const p=matPrice(G,m);return `<div class="box" style="border-left:8px solid ${COLOR[M.a]}"><div class="row sb"><div><div class="kick">${M.a} · grade ${M.g}${M.rare?' · expedition only':''}</div><div class="hl" style="font-size:16px">${M.n}</div></div>${tag(m)}</div>
 <div class="row sb"><span class="price">${M.rare?'—':p==null?'—':p+'<small>g</small>'}</span><span class="row"><span class="muted">×${G.inv.mat[m]||0}</span><button data-act="buymat" data-id="${m}" ${p==null?'disabled':''}>Buy</button></span></div></div>`}).join('')}</div></div>
 <div class="two"><div class="box"><div class="kick">Grocer's counter</div><div class="hl">Foods</div>${Object.keys(FOODS).map(f=>{const F=FOODS[f];const side=F.side?(F.side.k==='stat'?`${F.side.amt>0?'+':''}${F.side.amt} ${F.side.key}`:F.side.k==='temper'?(F.side.amt>0?'→ Fierce':'→ Docile'):(F.side.amt>0?'→ Lively':'→ Quiet')):'no downside';
 return `<div class="row sb" style="padding:5px 0;border-bottom:1px dotted #aaa"><span><b>${F.n}</b> <span class="bd">grade ${F.g}</span><br><span class="muted" style="font-size:12px">+${F.v} ${F.to[1]} · ${side} · tox ${F.tox}</span></span><span class="row"><span class="muted">×${G.inv.food[f]||0}</span>${F.rare?'<span class="muted">rare</span>':`<button data-act="buyfood" data-id="${f}" ${G.rep<(F.rep||0)?'disabled':''}>${F.p}g${F.rep&&G.rep<F.rep?' · rep '+F.rep:''}</button>`}</span></div>`}).join('')}</div>
 <div><div class="box" style="margin-bottom:12px"><div class="kick">Odds and ends</div><div class="hl">Mix-ins</div>${Object.keys(MIX).map(x=>`<div class="row sb" style="padding:5px 0;border-bottom:1px dotted #aaa"><span><b>${MIX[x].n}</b><br><span class="muted" style="font-size:12px">${MIX[x].text}</span></span><span class="row"><span class="muted">×${G.inv.mix[x]||0}</span><button data-act="buymix" data-id="${x}">${MIX[x].p}g</button></span></div>`).join('')}</div>
 <div class="box" style="margin-bottom:12px"><div class="kick">Shrine · null spirits · temperament as drawn</div><div class="hl">Spirits</div>${st.spirits.map((s,i)=>`<div class="row sb" style="padding:5px 0;border-bottom:1px dotted #aaa"><span><b>${esc(s.name)}</b> <span class="muted">${band(s.temper)} · ${mband(s.mood)}</span></span><button data-act="buyspirit" data-id="${i}">${CONFIG.spiritPrice}g</button></div>`).join('')||'<span class="muted">The shrine is out of spirits this issue.</span>'}</div>
 <div class="box"><div class="kick">Fixtures</div><div class="hl">Stations for sale</div>${Object.keys(STB).filter(id=>!G.stations[id].owned).map(id=>{const S=STB[id];return `<div class="row sb" style="padding:5px 0;border-bottom:1px dotted #aaa"><span><b>${S.n}</b> <span class="muted">trains ${S.trains.join(' + ')}${S.env?' · env '+(S.env.amt<0?'→ '+(S.env.k==='mood'?'Quiet':'Docile'):''):''}</span></span><button data-act="buystation" data-id="${id}" ${G.rep<(S.rep||0)?'disabled':''}>${S.p}g${S.rep&&G.rep<S.rep?' · rep '+S.rep:''}</button></div>`}).join('')||'<span class="muted">Nothing left to buy.</span>'}</div></div></div>`;}

function workshop(){const ro=roster();const opt=(arr,sel,lab)=>arr.map(v=>`<option value="${v.id}" ${sel===v.id?'selected':''}>${lab(v)}</option>`).join('');
 const stCards=Object.keys(STB).filter(id=>G.stations[id].owned).map(id=>{const I=stationInfo(id);const S=I.S;return `<div class="box"><div class="row sb"><div><div class="kick">${S.fam} · trains ${S.trains.join(' + ')}</div><div class="hl">${S.n}</div></div><div class="punch">${Array.from({length:I.sessions},(_,i)=>`<i class="${i<I.st.used?'used':''}"></i>`).join('')}</div></div>
 <div class="muted" style="font-size:12px">${S.fixed?'Mundane. Fixed ceiling '+gradeOf(S.mund)+'.':I.sp?`Tended by <b>${esc(I.sp.name)}</b>. Body cap ${gradeOf(S.cap)}.`:'Mundane, no spirit. Ceiling '+gradeOf(S.mund)+', '+I.pts+' points a session.'}</div>
 <div class="badges">${S.trains.map(k=>`<span class="bd">${k} ceiling ${gradeOf(I.ceil[k])}</span>`).join('')}<span class="bd">${I.pts} pts/session</span>${S.env?`<span class="bd" style="border-style:dashed">env → ${S.env.k==='mood'?'Quiet':'Docile'}</span>`:''}</div>
 ${S.fixed?'':`<div class="row">${I.sp?`<button data-act="release" data-id="${id}">Release spirit</button>`:''}<select data-f="poss" data-id="${id}"><option value="">Possess with…</option>${opt(ro,UI.poss.id===id?UI.poss.vid:'',v=>spiritOf(v).name+' the '+v.name+' ('+S.trains.map(k=>k+' '+gradeOf(effVal(v,spiritOf(v),k))).join(', ')+')')}</select><button data-act="possess" data-id="${id}" ${UI.poss.id===id&&UI.poss.vid?'':'disabled'}>Move in</button></div>
 <div class="muted" style="font-size:11px">Moving in costs the spirit ${Math.round((1-CONFIG.transferKeep)*100)}% of its exp; the old body stays on the shelf.</div>`}</div>`}).join('');
 const t=UI.train;const tv=t.vid&&G.vessels[t.vid]?G.vessels[t.vid]:null;const tp=tv&&t.key?trainPreview(t.id,t.vid,t.key):null;
 const f=UI.feed;const fv=f.vid&&G.vessels[f.vid]?G.vessels[f.vid]:null;const fp=fv&&f.fid?feedPreview(f.vid,f.fid):null;const foods=Object.keys(FOODS).filter(k=>G.inv.food[k]>0);
 return `<div class="grid">${stCards}</div><div class="two" style="margin-top:12px">
 <div class="box dbl"><div class="kick">Be a new creature in 30 issues</div><div class="hl">Training</div><div class="form">
 <label>Station <select data-f="tst">${Object.keys(STB).filter(id=>G.stations[id].owned).map(id=>`<option value="${id}" ${t.id===id?'selected':''}>${STB[id].n} — ${STB[id].trains.join(' + ')}</option>`).join('')}</select></label>
 <label>Creature <select data-f="tv"><option value="">—</option>${opt(ro,t.vid,v=>spiritOf(v).name+' the '+v.name)}</select></label>
 <label>Raise <div class="sel">${STB[t.id].trains.map(k=>`<button data-f="tk" data-v="${k}" class="${t.key===k?'on':''}">${k}${tv?' '+effVal(tv,spiritOf(tv),k):''}</button>`).join('')}</div></label></div>
 ${tp?tp.err?`<div class="note">${tp.err}</div>`:`<div class="note">${t.key} ${tp.cur} → ${tp.cur+tp.gain} (${tp.pts} pts, ceiling ${gradeOf(tp.ceil)} = ${tp.ceil}, cap ${tp.cap})${tp.env?' · shifts '+(tp.env.k==='mood'?'mood':'temper')+' '+tp.env.amt:''}${tp.gain<=0?' · <b>nothing to gain here</b>':''}</div>`:''}
 <button class="pri" data-act="train" ${tp&&!tp.err&&tp.gain>0?'':'disabled'}>Train (uses a session)</button></div>
 <div class="box dbl"><div class="kick">Serving suggestion · every feed is for life</div><div class="hl">Feeding</div><div class="form">
 <label>Creature <select data-f="fv"><option value="">—</option>${opt(ro,f.vid,v=>spiritOf(v).name+' the '+v.name+' · tox '+spiritOf(v).tox)}</select></label>
 <label>Food <select data-f="ff"><option value="">—</option>${foods.map(k=>`<option value="${k}" ${f.fid===k?'selected':''}>${FOODS[k].n} ×${G.inv.food[k]} — grade ${FOODS[k].g}, +${FOODS[k].v} ${FOODS[k].to[1]}, tox ${FOODS[k].tox}</option>`).join('')}</select></label></div>
 ${fp?fp.err?`<div class="note">${fp.err}</div>`:`<div class="note">${fp.key} ${fp.cur} → ${fp.cur+fp.capped}${fp.above?' (diminished: '+fp.above+' band'+(fp.above>1?'s':'')+' above the food\'s grade)':''}${fp.capped<fp.gain?' · at the vessel\'s cap':''} · toxicity → ${fp.toxAfter}/${CONFIG.toxCap}${fp.ok?'':' <b>too much</b>'}${fp.side?' · side: '+(fp.side.k==='stat'?fp.side.amt+' '+fp.side.key:fp.side.k+' '+(fp.side.amt>0?'+':'')+fp.side.amt):''}</div>${therm(fp.toxAfter,CONFIG.toxCap,true)}`:(foods.length?'':'<div class="muted">Pantry is empty. Buy food on the Specials page.</div>')}
 <button class="pri" data-act="feed" ${fp&&!fp.err&&fp.ok?'':'disabled'}>Feed</button></div></div>`;}

function rosterTab(){const ro=roster();const ev=emptyVessels();const bx=boxSpirits();const onTrip=G.exped?G.vessels[G.exped.vesselId]:null;
 return `<div class="kick" style="margin-bottom:6px">The color insert · ${ro.length} on the shelf</div><div class="grid wide">${ro.map(v=>creatureCard(v,`<button data-act="transfer" data-id="${v.id}">Spirit out (−${Math.round((1-CONFIG.transferKeep)*100)}% exp)</button>`)).join('')||'<div class="box muted">Nothing on the shelf. Fill in an order form.</div>'}
 ${onTrip?creatureCard(onTrip,'<span class="stamp">On expedition</span>'):''}</div>
 <div class="two" style="margin-top:12px"><div class="box"><div class="kick">Back room</div><div class="hl">Empty vessels</div>${ev.map(v=>`<div class="row sb" style="padding:5px 0;border-bottom:1px dotted #aaa"><span><b>${v.name}</b> <span class="muted">${v.mats.map(m=>MATS[m].n).join(', ')||'plain'}</span></span><span class="row"><select data-f="pe" data-id="${v.id}"><option value="">Possess with…</option>${bx.map(s=>`<option value="${s.id}" ${UI.pe.vid===v.id&&UI.pe.sid===s.id?'selected':''}>${esc(s.name)} — ${tempText(s)}</option>`).join('')}</select><button data-act="possessempty" data-id="${v.id}" ${UI.pe.vid===v.id&&UI.pe.sid?'':'disabled'}>Move in</button><button data-act="salvage" data-id="${v.id}">Salvage</button></span></div>`).join('')||'<span class="muted">None.</span>'}</div>
 <div class="box"><div class="kick">Spirit box</div><div class="hl">Unhoused spirits</div>${bx.map(s=>`<div style="padding:5px 0;border-bottom:1px dotted #aaa"><b>${esc(s.name)}</b> <span class="muted">${tempText(s)} · exp ${s.exp} · tox ${s.tox}</span><div class="muted" style="font-size:12px">${STATS.concat(AFF).filter(k=>s.v[k]>0).map(k=>k+' '+s.v[k]).join(', ')||'blank'}</div></div>`).join('')||'<span class="muted">Empty. The shrine sells null spirits.</span>'}</div></div>`;}

function travel(){const e=G.exped;const ro=roster();
 const locs=Object.keys(LOCS).map(id=>{const L=LOCS[id];const d=G.disc[id]||{};return `<div class="box dbl"><div class="kick">Travel section · level ${L.lvl}${L.rep?' · needs rep '+L.rep:''}</div><div class="hl">${L.n}</div>
 <ol style="margin:4px 0 8px 18px;padding:0">${L.trials.map((t,i)=>`<li>${d[i]?`${t[0]} ≥ ${t[1]} → ${t[2].startsWith('mat:')?MATS[t[2].slice(4)].n:FOODS[t[2].slice(5)].n}`:'<span class="muted">unknown trial</span>'}</li>`).join('')}</ol>
 <div class="muted" style="font-size:12px">One trial per issue. Gains up to grade ${L.lvl}. A failed trial breaks the body; the spirit comes home with half the haul.</div>
 <div class="row" style="margin-top:6px"><select data-f="send" data-id="${id}"><option value="">Send…</option>${ro.map(v=>`<option value="${v.id}" ${UI.send.loc===id&&UI.send.vid===v.id?'selected':''}>${esc(spiritOf(v).name)} the ${v.name}</option>`).join('')}</select><button class="pri" data-act="send" data-id="${id}" ${e||!(UI.send.loc===id&&UI.send.vid)||G.rep<(L.rep||0)?'disabled':''}>Set out</button></div></div>`}).join('');
 const act=e?`<div class="box" style="margin-bottom:12px;border-color:var(--red)"><div class="kick">Field report</div><div class="hl">${esc(spiritOf(G.vessels[e.vesselId]).name)} at ${LOCS[e.loc].n} · trial ${e.step+1} of ${LOCS[e.loc].trials.length}</div>
 <div>Haul so far: ${e.haul.map(h=>h.startsWith('mat:')?MATS[h.slice(4)].n:FOODS[h.slice(5)].n).join(', ')||'nothing yet'}</div>
 ${e.await?`<div class="note">Passed. Press on for the next trial, or come home with the haul.</div><div class="row"><button class="pri" data-act="presson">Press on</button><button data-act="return">Return home</button></div>`:'<div class="note">On the road. The next trial resolves when the issue goes to press.</div>'}</div>`:'';
 return act+`<div class="grid wide">${locs}</div>`;}

function ledger(){const cust=Object.keys(CUST).map(c=>{const n=G.sold.filter(s=>s.c===c).length;return `<div class="row sb" style="padding:3px 0;border-bottom:1px dotted #aaa"><span><b>${CUST[c].n}</b> <span class="muted">${CUST[c].t}</span></span><span class="muted">${n} in service</span></div>`}).join('');
 return `<div class="two"><div><div class="box" style="margin-bottom:12px"><div class="kick">Ledger</div><div class="hl">What happened</div><div class="log">${G.log.map(l=>`<div><b>No.${l.i}</b>${esc(l.t)}</div>`).join('')}</div></div>
 <div class="box"><div class="kick">Customer files</div><div class="hl">The street</div>${cust}<div class="muted" style="margin-top:6px;font-size:12px">Sold creatures gain ${CONFIG.expPerIssue} exp an issue and outgrow a small body at ${CONFIG.outgrow1}, a medium one at ${CONFIG.outgrow2}. Then the customer comes back.</div>
 ${G.sold.map(s=>`<div class="muted" style="font-size:12px">${esc(G.spirits[s.spiritId].name)} the ${s.vname} at ${CUST[s.c].n}'s · exp ${G.spirits[s.spiritId].exp}</div>`).join('')}</div></div>
 <div><div class="box" style="margin-bottom:12px"><div class="kick">Pickle</div><div class="hl">Save &amp; load</div><div class="muted" style="font-size:12px">Progress autosaves in this browser. Copy the pickle to keep a state or send it back with notes.</div>
 <div class="row" style="margin:6px 0"><button data-act="pickle">Export pickle</button><button data-act="unpickle">Load pickle below</button><button class="red" data-act="newgame">${UI.confirmNew?'Really start over?':'New game'}</button></div><textarea id="pickle" rows="6" placeholder="pickle JSON">${esc(UI.pickle)}</textarea></div>
 <div class="box"><div class="kick">Tuning</div><div class="hl">The numbers</div><div class="muted" style="font-size:12px">Edit and apply. Takes effect immediately; saved with the pickle.</div><textarea id="cfg" rows="8">${esc(JSON.stringify(CONFIG,null,1))}</textarea><div class="row" style="margin-top:6px"><button data-act="cfg">Apply tuning</button></div></div></div></div>`;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],button[data-f]');if(!b)return;const id=b.dataset.id,a=b.dataset.act;
 if(b.dataset.f){const f=b.dataset.f,v=b.dataset.v;if(f==='tier'){UI.order.tier=+v;}if(f==='tk'){UI.train.key=v;}render();return;}
 if(a==='tab'){UI.tab=id;render();return;}
 if(a==='next'){act(()=>{nextIssue();UI.pick={};});return;}
 if(a==='pick'){UI.pick[id]=!UI.pick[id];render();return;}
 if(a==='open'){UI.open[id]=!UI.open[id];render();return;}
 if(a==='deliver'){act(()=>deliver(id,b.dataset.v));return;}
 if(a==='decline'){act(()=>{decline(id);});return;}
 if(a==='accept'){act(()=>{accept(id);});return;}
 if(a==='place'){const o=UI.order;act(()=>{const e=placeOrder(o.fam,o.tier,o.mats.filter(Boolean),o.mix?[o.mix]:[],o.spirit);if(!e){o.mats=[];o.mix='';o.spirit='';toast('Order placed. See the Roster.');}return e;});return;}
 if(a==='buymat'){act(()=>buyMat(id));return;}if(a==='buyfood'){act(()=>buyFood(id));return;}if(a==='buymix'){act(()=>buyMix(id));return;}if(a==='buyspirit'){act(()=>buySpirit(+id));return;}if(a==='buystation'){act(()=>buyStation(id));return;}
 if(a==='train'){act(()=>train(UI.train.id,UI.train.vid,UI.train.key));return;}
 if(a==='feed'){act(()=>feed(UI.feed.vid,UI.feed.fid));return;}
 if(a==='possess'){act(()=>{const e=possessStation(id,UI.poss.vid);if(!e)UI.poss.vid='';return e;});return;}
 if(a==='release'){act(()=>{releaseStation(id);});return;}
 if(a==='transfer'){act(()=>transferOut(id));return;}
 if(a==='salvage'){act(()=>salvage(id));return;}
 if(a==='possessempty'){act(()=>{const e=possessEmpty(id,UI.pe.sid);if(!e)UI.pe={vid:'',sid:''};return e;});return;}
 if(a==='send'){act(()=>send(UI.send.vid,id));return;}
 if(a==='presson'){act(()=>{pressOn();});return;}if(a==='return'){act(()=>{returnHome();});return;}
 if(a==='pickle'){UI.pickle=exportState();render();navigator.clipboard&&navigator.clipboard.writeText(UI.pickle).then(()=>toast('Pickle copied to clipboard'),()=>toast('Pickle is in the box below'));return;}
 if(a==='unpickle'){try{importState($('#pickle').value);save();toast('Loaded');}catch(err){toast('That pickle did not load: '+err.message);}render();return;}
 if(a==='newgame'){if(!UI.confirmNew){UI.confirmNew=true;render();return;}UI.confirmNew=false;newGame();save();render();return;}
 if(a==='cfg'){try{const c=JSON.parse($('#cfg').value);Object.assign(CONFIG,c);save();toast('Tuning applied');}catch(err){toast('Bad JSON: '+err.message);}render();return;}
});
document.addEventListener('change',e=>{const s=e.target;if(!s.dataset.f)return;const f=s.dataset.f,v=s.value;
 if(f==='fam')UI.order.fam=v;else if(f==='mat')UI.order.mats[+s.dataset.i]=v;else if(f==='mix')UI.order.mix=v;else if(f==='spirit')UI.order.spirit=v;
 else if(f==='tst'){UI.train.id=v;UI.train.key='';}else if(f==='tv')UI.train.vid=v;else if(f==='fv')UI.feed.vid=v;else if(f==='ff')UI.feed.fid=v;
 else if(f==='poss')UI.poss={id:s.dataset.id,vid:v};else if(f==='pe')UI.pe={vid:s.dataset.id,sid:v};else if(f==='send')UI.send={loc:s.dataset.id,vid:v};
 render();});
if(!load())newGame();render();
</script>

</body>
</html>
