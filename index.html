<html lang="en">

<title>Yorishiro Weekly</title>

<style>
/* Layout: a single newsprint column with a masthead, section tabs, and dense bordered boxes like a 1950s shopper. Single theme on purpose: the page is the paper. */
:root{
  --paper:#efe4c9; --paper2:#f6eedc; --ink:#1c1915; --ink2:#4a4239; --muted:#7a7064; --red:#c8362b;
  --ember:#c8362b; --frost:#4e9fd1; --bloom:#4f8f3a; --clay:#c28a2c; --tide:#2b3f8c; --none:#8a6fb5;
  --fd:'Rye',Georgia,serif; --fh:'Oswald','Arial Narrow',Arial,sans-serif; --fb:'Libre Baskerville',Georgia,serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;
  background-image:radial-gradient(rgba(28,25,21,.07) 1px,transparent 1.2px);background-size:5px 5px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
*{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:12px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);padding:5px 10px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper2)}
button.pri{background:var(--ink);color:var(--paper2)} button.pri:hover{background:var(--red);border-color:var(--red)}
button.red{border-color:var(--red);color:var(--red)} button.red:hover{background:var(--red);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed} button:disabled:hover{background:var(--paper2);color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
select,textarea{font-family:var(--fh);font-size:13px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);padding:4px 6px;max-width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%}
.wrap{max-width:1040px;margin:0 auto}
.mast{border-top:4px solid var(--ink);border-bottom:2px solid var(--ink);padding:8px 0 6px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px}
.mast h1{font-family:var(--fd);font-size:clamp(30px,7vw,60px);line-height:1;letter-spacing:.02em}
.mast .sub{font-family:var(--fh);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--ink2)}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:2px solid var(--ink);padding:6px 0;font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.strip b{font-size:16px;font-variant-numeric:tabular-nums}
.strip .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:4px double var(--ink)}
.tabs button{border:0;border-right:1px solid var(--ink);background:none;padding:8px 12px;font-size:12px}
.tabs button:last-child{border-right:0}
.tabs button.on{background:var(--ink);color:var(--paper2)}
.tabs button.go{box-shadow:inset 0 -4px var(--red)}
.tabs button:disabled{opacity:.3}
.tut{margin-top:12px;border-left:10px solid var(--red)}
.tut p{margin:6px 0 0;font-size:15px}
.view{padding-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.box{border:2px solid var(--ink);background:var(--paper2);padding:10px 12px;min-width:0;position:relative}
.box.dbl{outline:1px solid var(--ink);outline-offset:3px}
.kick{font-family:var(--fh);text-transform:uppercase;letter-spacing:.14em;font-size:10px;color:var(--ink2)}
.hl{font-family:var(--fh);font-weight:600;text-transform:uppercase;font-size:20px;line-height:1.05;letter-spacing:.01em;margin:2px 0 6px}
.hl.big{font-size:26px}
.copy{font-style:italic;color:var(--ink2);margin:4px 0 8px}
.hint{font-size:12px;color:var(--ink2);margin:0 0 8px}
.hint:before{content:"Overheard: ";font-family:var(--fh);text-transform:uppercase;letter-spacing:.1em;font-style:normal;font-size:10px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.bd{font-family:var(--fh);text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1.5px solid var(--ink);padding:2px 7px;background:var(--paper2);white-space:nowrap}
.bd.met{background:var(--ink);color:var(--paper2)} .bd.short{border-color:var(--red);color:var(--red);text-decoration:line-through}
.bd.aff{border-left-width:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.price{font-family:var(--fh);font-weight:600;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.stamp{font-family:var(--fh);font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--red);border:3px solid var(--red);padding:2px 8px;transform:rotate(-4deg);display:inline-block;font-size:12px}
.burst{font-family:var(--fh);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.08em;background:var(--red);color:#fff;clip-path:polygon(50% 0%,61% 12%,78% 5%,80% 22%,97% 25%,89% 40%,100% 50%,89% 60%,97% 75%,80% 78%,78% 95%,61% 88%,50% 100%,39% 88%,22% 95%,20% 78%,3% 75%,11% 60%,0% 50%,11% 40%,3% 25%,20% 22%,22% 5%,39% 12%);padding:10px 12px}
.muted{color:var(--muted)}
.strip2{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0}
.strip2.aff{grid-template-columns:repeat(5,1fr)}
.cell{text-align:center;border:1px solid var(--ink);padding:3px 2px;line-height:1.05;min-width:0;cursor:help}
.cell .k{font-family:var(--fh);text-transform:uppercase;font-size:9px;letter-spacing:.06em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .g{font-family:var(--fh);font-weight:600;font-size:18px}
.cell .g small{font-size:11px;font-weight:400;color:var(--muted)}
.cell.cap0{opacity:.35}
.cell.str .g{color:var(--red)}
.cell.aff{border-top:4px solid var(--ink)}
.therm{display:flex;gap:2px;margin:4px 0}
.therm i{flex:1;height:8px;border:1px solid var(--ink);background:var(--paper2)} .therm i.on{background:var(--ink)} .therm i.hot{background:var(--red)}
.punch{display:flex;gap:4px} .punch i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block} .punch i.used{background:var(--ink)}
.cre{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.cre svg{width:72px;height:72px;display:block}
.diary{border-top:1px dashed var(--ink);margin-top:8px;padding-top:6px;font-size:12px;color:var(--ink2)}
.diary div:before{content:"✦ "}
.log{font-size:12px;max-height:320px;overflow:auto;border:1px solid var(--ink);padding:6px 8px;background:var(--paper2)}
.log div{padding:2px 0;border-bottom:1px dotted #bbb}
.log b{font-family:var(--fh);font-weight:400;color:var(--muted);margin-right:6px}
.form{display:grid;grid-template-columns:1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ink2)}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border-top:2px dashed var(--ink);margin-top:8px;padding-top:6px}
.receipt div{display:flex;justify-content:space-between}
.receipt .tot{border-top:1px solid var(--ink);margin-top:4px;padding-top:4px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper2);font-family:var(--fh);text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:8px 14px;border:2px solid var(--paper2);max-width:90vw;z-index:9}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel button.on{background:var(--ink);color:var(--paper2)}
.rel{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);border-left:3px solid var(--red);padding-left:8px;margin:6px 0}
.line{padding:5px 0;border-bottom:1px dotted #aaa}
@media (prefers-reduced-motion:no-preference){.box.new{animation:pop .25s ease-out}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

const unlockText=u=>!u?'':u.cart?MOLDS[u.cart].name+' always on Sasaki\'s cart':u.dealer?MOLDS[u.dealer].name+' always on the dealer\'s cart':u.loc?LOCS[u.loc].n+' opens':u.food?FOODS[u.food].n+' at the grocer':'';

const band=t=>t<=-5?'Docile':t>=5?'Fierce':'Steady', mband=m=>m<=-5?'Quiet':m>=5?'Lively':'Even';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const matFloor=m=>bandBot(MATS[m].g), matCap=m=>bandTop(GR[Math.min(5,gi(MATS[m].g)+1)]);
const matPrice=(G,m)=>{const M=MATS[m];if(M.rare)return null;if(G.stock.soldout===m)return null;if(G.stock.limited===m&&!G.stock.limitedLeft)return null;return G.stock.special===m?Math.round(M.p*0.6):M.p};
const itemName=c=>{const [k,id]=c.split(':');return k==='mat'?MATS[id].n:k==='food'?FOODS[id].n:MOLDS[id].name+' mold';};

let G=null;
function newGame(){G={issue:1,gold:CONFIG.gold,rep:0,inv:{mat:{wax:1,straw:1,water:1},food:{potato:2},mix:{},mold:{candle:1,whisk:1}},spirits:{},vessels:{},n:1,
 requests:[],sold:[],exped:null,stock:null,log:[],done:{},disc:{},deliveries:0,tut:0,cust:{},unl:{cart:[],dealer:[],loc:[],food:[]}};
 for(const c in CUST)G.cust[c]={step:0,ready:0,seen:CUST[c].enter===0?1:0};
 const s=newSpirit({temper:-6,mood:-2});G.spirits[s.id]=s;
 rollStock();// issue 1 is fixed so the tutorial holds
 Object.assign(G.stock,{special:'charcoal',limited:'pearl',soldout:'earth',limitedLeft:1,molds:[{id:'teapot',price:35},{id:'ladle',price:20},{id:'kokeshi',price:20}],dealer:[{id:'treadle',price:45},{id:'hibachi',price:45}]});
 postRung('koda');postRung('shiraishi');log('The shop opens. Two requests on the counter, one spirit in the box, two molds on the shelf.');return G;}
const uid=p=>p+(G.n++);
function log(t){G.log.unshift({i:G.issue,t});if(G.log.length>80)G.log.length=80;}
function newSpirit(o={}){const v={};STATS.concat(AFF).forEach(k=>v[k]=0);return {id:uid('s'),name:o.name||pick(NAMES),v,exp:0,tox:0,temper:o.temper??rnd(-9,9),mood:o.mood??rnd(-9,9),hist:[],vesselId:null,owner:null};}
function drawMolds(n,pool){const out=[],ids=pool.slice();for(let i=0;i<n&&ids.length;i++){const tot=ids.reduce((s,id)=>s+RARITY[MOLDS[id].rarity].w,0);let r=Math.random()*tot;for(let j=0;j<ids.length;j++){r-=RARITY[MOLDS[ids[j]].rarity].w;if(r<=0){out.push({id:ids[j],price:RARITY[MOLDS[ids[j]].rarity].p});ids.splice(j,1);break;}}}return out;}
const dealerIn=()=>(G.issue-1)%CONFIG.dealerEvery===0;
function rollStock(){const ids=shuffle(Object.keys(MATS).filter(m=>!MATS[m].rare));G.stock={special:ids[0],limited:ids[1],soldout:ids[2],limitedLeft:1,spirits:[0,1,2].map(()=>({name:pick(NAMES),temper:rnd(-9,9),mood:rnd(-9,9)})),
 molds:drawMolds(CONFIG.marketSize,CREATURE_MOLDS),dealer:dealerIn()?drawMolds(2,MACHINE_MOLDS):[]};
 if(G.tut>=0&&G.tut<=8&&dealerIn()&&!G.stock.dealer.some(m=>m.id==='treadle'))G.stock.dealer.unshift({id:'treadle',price:RARITY.machine.p});
 G.unl.cart.forEach(id=>{if(!G.stock.molds.some(m=>m.id===id))G.stock.molds.push({id,price:RARITY[MOLDS[id].rarity].p});});
 if(dealerIn())G.unl.dealer.forEach(id=>{if(!G.stock.dealer.some(m=>m.id===id))G.stock.dealer.push({id,price:RARITY.machine.p});});
 if(dealerIn())machines().filter(wornIn).map(v=>MOLDS[v.mold].next).filter(Boolean).forEach(id=>{if(!G.stock.dealer.some(m=>m.id===id)){G.stock.dealer.push({id,price:RARITY.machine2.p});log('The dealer saw a worn-in machine in your workshop and brought a '+MOLDS[id].name+'.');}});}
function postRung(c){const id=CUST[c].ladder[G.cust[c].step];const t=REQ[id];G.requests.push({...t,id,uid:uid('q'),due:t.due,cons:t.cons.map(x=>x.slice())});}
const entered=c=>G.deliveries>=CUST[c].enter;
function readyRungs(){return Object.keys(CUST).filter(c=>entered(c)&&G.cust[c].step<CUST[c].ladder.length&&G.issue>=G.cust[c].ready&&!G.requests.some(r=>r.c===c&&!r.kind));}
function applyUnlock(u){if(!u)return '';if(u.cart){G.unl.cart.push(u.cart);return 'Sasaki will keep the '+MOLDS[u.cart].name+' mold on the cart from now on.';}if(u.dealer){G.unl.dealer.push(u.dealer);return 'The machine dealer will carry the '+MOLDS[u.dealer].name+' from now on.';}if(u.loc){G.unl.loc.push(u.loc);return LOCS[u.loc].n+' is open on the Travel page.';}if(u.food){G.unl.food.push(u.food);return 'The grocer now stocks '+FOODS[u.food].n+'.';}return '';}

// --- vessels ---
function buildVessel(mid,mats,mixes){const M=MOLDS[mid],T=TIER[M.tier];const floors={},caps={};
 STATS.forEach(s=>{const l=M.lean.includes(s);floors[s]=l?T.leanF:T.otherF;caps[s]=l?T.leanC:T.otherC;});
 AFF.forEach(a=>{floors[a]=0;caps[a]=9;});
 if(M.native){floors[M.native]=T.natF;caps[M.native]=T.natC;}
 mats.forEach(m=>{const a=MATS[m].a;floors[a]=Math.max(floors[a],matFloor(m));caps[a]=Math.max(caps[a],matCap(m));});
 const mute=mixes.includes('ash');if(mixes.includes('gold')&&M.native)caps[M.native]+=10;
 const present=AFF.filter(a=>floors[a]>0),rel=[];
 present.forEach(a=>present.forEach(b=>{if(FEEDS[a]===b){caps[b]+=10;caps[a]-=10;rel.push(a+' feeds '+b+' (+'+b+' cap, −'+a+' cap)');}
  if(QUELLS[a]===b){if(mute)rel.push(a+' quells '+b+' — muted');else{caps[a]-=10;caps[b]-=10;rel.push(a+' quells '+b+' (both caps −1 band)');}}}));
 AFF.forEach(a=>{caps[a]=Math.max(0,Math.min(59,caps[a]));floors[a]=Math.min(floors[a],caps[a]);});
 return {id:null,mold:mid,art:M.art,tier:M.tier,size:M.size||T.size,tags:M.tags,station:M.station||null,env:M.env||null,floors,caps,mats:mats.slice(),mix:mixes.slice(),rel,spiritId:null,name:M.name,used:0};}
function orderCost(mid,mats,mixes,spiritChoice){let items=[['Mold: '+MOLDS[mid].name+' (from stock)',0]];const owned={...G.inv.mat},ownedMix={...G.inv.mix};
 for(const m of mats){if(owned[m]>0){owned[m]--;items.push([MATS[m].n+' (owned)',0]);}else{const p=matPrice(G,m);if(p==null)return {err:MATS[m].n+' is not available'};items.push([MATS[m].n,p]);}}
 for(const x of mixes){if(ownedMix[x]>0){ownedMix[x]--;items.push([MIX[x].n+' (owned)',0]);}else items.push([MIX[x].n,MIX[x].p]);}
 if(spiritChoice&&spiritChoice.startsWith('shop:'))items.push(['Null spirit (shrine)',CONFIG.spiritPrice]);
 return {items,total:items.reduce((s,i)=>s+i[1],0)};}
function placeOrder(mid,mats,mixes,spiritChoice){const M=MOLDS[mid];if(!M)return 'Pick a mold';
 if(!(G.inv.mold[mid]>0))return 'No '+M.name+' mold in stock';
 const slots=TIER[M.tier].mat+(mixes.includes('lacing')?1:0);if(mats.length>slots)return 'Too many materials for this mold';
 const c=orderCost(mid,mats,mixes,spiritChoice);if(c.err)return c.err;if(c.total>G.gold)return 'Not enough gold ('+c.total+'g)';
 G.gold-=c.total;G.inv.mold[mid]--;
 for(const m of mats){if(G.inv.mat[m]>0)G.inv.mat[m]--;else if(G.stock.limited===m)G.stock.limitedLeft=0;}
 for(const x of mixes){if(G.inv.mix[x]>0)G.inv.mix[x]--;}
 const v=buildVessel(mid,mats,mixes);v.id=uid('v');G.vessels[v.id]=v;
 let sp=null;if(spiritChoice&&spiritChoice.startsWith('shop:')){const st=G.stock.spirits[+spiritChoice.slice(5)];if(!st)return 'That spirit is gone';sp=newSpirit(st);G.spirits[sp.id]=sp;G.stock.spirits.splice(+spiritChoice.slice(5),1);}
 else if(spiritChoice)sp=G.spirits[spiritChoice];
 if(sp)possess(v,sp);
 log('Made a '+v.name+(v.station?' and installed it in the workshop':'')+(sp?'; '+sp.name+' moved in.':' (empty).')+' Cost '+c.total+'g.');return null;}
function possess(v,s){STATS.concat(AFF).forEach(k=>{s.v[k]=Math.max(s.v[k],v.floors[k]);});v.spiritId=s.id;s.vesselId=v.id;s.hist.push('Issue '+G.issue+': took the '+v.name+' as a body.');}
function spiritOf(v){return v&&v.spiritId?G.spirits[v.spiritId]:null;}
const effVal=(v,s,k)=>Math.min(s.v[k],v.caps[k]);
const straining=(v,s)=>STATS.concat(AFF).some(k=>s.v[k]>v.caps[k]);
function transferOut(vid){const v=G.vessels[vid],s=spiritOf(v);if(!s)return 'Empty';s.exp=Math.floor(s.exp*CONFIG.transferKeep);s.vesselId=null;v.spiritId=null;s.hist.push('Issue '+G.issue+': left the '+v.name+'.');log(s.name+' left the '+v.name+'; exp trimmed to '+s.exp+'.');return null;}
function salvage(vid){const v=G.vessels[vid];if(v.spiritId)return 'Still possessed';delete G.vessels[vid];if(v.mats.length){const m=pick(v.mats);G.inv.mat[m]=(G.inv.mat[m]||0)+1;log('Salvaged the '+v.name+': '+MATS[m].n+' recovered.');}else log('Salvaged the '+v.name+'. Nothing came back.');return null;}
function roster(){return Object.values(G.vessels).filter(v=>v.spiritId&&!(G.exped&&G.exped.vesselId===v.id));}
function machines(){return Object.values(G.vessels).filter(v=>v.station);}
const wornIn=v=>{const s=spiritOf(v);return !!s&&v.station.some(k=>s.v[k]>=v.caps[k]);};// at its cap in a stat it teaches: time for a bigger machine
function boxSpirits(){return Object.values(G.spirits).filter(s=>!s.vesselId&&!s.owner);}
function emptyVessels(){return Object.values(G.vessels).filter(v=>!v.spiritId);}
function possessEmpty(vid,sid){const v=G.vessels[vid],s=G.spirits[sid];if(!v||!s||v.spiritId||s.vesselId)return 'No';possess(v,s);log(s.name+' moved into the '+v.name+'.');return null;}

// --- feeding ---
function feedPreview(vid,fid){const v=G.vessels[vid],s=spiritOf(v),F=FOODS[fid];if(!s)return {err:'Empty'};const [kind,key]=F.to;const cur=s.v[key];
 const above=Math.max(0,gi(gradeOf(cur))-gi(F.g));let gain=Math.floor(F.v/Math.pow(2,above));const capped=Math.max(0,Math.min(gain,v.caps[key]-cur));
 return {key,cur,gain,capped,above,toxAfter:s.tox+F.tox,ok:s.tox+F.tox<=CONFIG.toxCap,side:F.side};}
function feed(vid,fid){if(!(G.inv.food[fid]>0))return 'None in the pantry';const p=feedPreview(vid,fid);if(p.err)return p.err;if(!p.ok)return 'Toxicity would pass '+CONFIG.toxCap;
 const v=G.vessels[vid],s=spiritOf(v),F=FOODS[fid];G.inv.food[fid]--;s.v[p.key]+=p.capped;s.tox+=F.tox;applySide(s,F.side);
 s.hist.push('Issue '+G.issue+': ate '+F.n+' (+'+p.capped+' '+p.key+').');log(s.name+' ate '+F.n+': +'+p.capped+' '+p.key+(p.above?' (diminished)':'')+', toxicity '+s.tox+'.');return null;}
function applySide(s,side){if(!side)return;if(side.k==='stat')s.v[side.key]=Math.max(0,s.v[side.key]+side.amt);else if(side.k==='temper')s.temper=Math.max(-15,Math.min(15,s.temper+side.amt));else if(side.k==='mood')s.mood=Math.max(-15,Math.min(15,s.mood+side.amt));}

// --- machines & training: a machine is a vessel; its spirit's grades are the ceiling ---
function stationInfo(sid){const v=G.vessels[sid],sp=spiritOf(v);const ceil={};let pts=0,sessions=0;
 if(sp){v.station.forEach(k=>ceil[k]=bandTop(gradeOf(effVal(v,sp,k))));pts=CONFIG.sessionPts+Math.floor(effVal(v,sp,'Knack')/10);sessions=effVal(v,sp,'Pace')>=CONFIG.sessionsFastPace?2:1;}
 return {v,sp,ceil,pts,sessions};}
function trainPreview(sid,vid,key){const st=G.vessels[sid];if(!st||!st.station)return {err:'Pick a machine'};const I=stationInfo(sid);if(!I.sp)return {err:'That machine is empty. A machine only works with a spirit inside.'};
 if(sid===vid)return {err:'A machine cannot train itself'};const v=G.vessels[vid],s=spiritOf(v);if(!s)return {err:'Pick a creature'};if(!st.station.includes(key))return {err:'This machine does not train '+key};
 if(st.used>=I.sessions)return {err:'No sessions left today'};const cur=s.v[key];const gain=Math.max(0,Math.min(I.pts,I.ceil[key]-cur,v.caps[key]-cur));
 return {gain,cur,ceil:I.ceil[key],cap:v.caps[key],pts:I.pts,env:st.env};}
function train(sid,vid,key){const p=trainPreview(sid,vid,key);if(p.err)return p.err;if(p.gain<=0)return p.cur>=p.ceil?'At this machine\'s ceiling ('+gradeOf(p.ceil)+')':'At the vessel\'s cap';
 const st=G.vessels[sid],v=G.vessels[vid],s=spiritOf(v);s.v[key]+=p.gain;st.used++;applySide(s,p.env);s.hist.push('Issue '+G.issue+': trained '+key+' at the '+st.name+' (+'+p.gain+').');log(s.name+' trained '+key+' +'+p.gain+' at the '+st.name+'.');
 // the machine learns by teaching: its own spirit gains in the stat it taught, up to the body's cap
 const ms=spiritOf(st);const before=gradeOf(effVal(st,ms,key));const mg=Math.max(0,Math.min(CONFIG.machineGain,st.caps[key]-ms.v[key]));if(mg>0){ms.v[key]+=mg;const after=gradeOf(effVal(st,ms,key));if(after!==before){ms.hist.push('Issue '+G.issue+': worn in; can teach '+key+' to '+after+'.');log('The '+st.name+' is worn in: it can teach '+key+' up to '+after+' now.');}if(wornIn(st)&&ms.v[key]>=st.caps[key])log('The '+st.name+' is at its cap for '+key+'. The dealer will bring a bigger one.');}
 return null;}

// --- shops ---
function buyMat(m){const p=matPrice(G,m);if(p==null)return 'Not available';if(G.gold<p)return 'Not enough gold';G.gold-=p;G.inv.mat[m]=(G.inv.mat[m]||0)+1;if(G.stock.limited===m)G.stock.limitedLeft=0;return null;}
function buyFood(f){const F=FOODS[f];if(F.rare)return 'Not for sale';if(F.unlock&&!G.unl.food.includes(f))return 'Not stocked yet: '+F.unlockText;if(G.gold<F.p)return 'Not enough gold';G.gold-=F.p;G.inv.food[f]=(G.inv.food[f]||0)+1;return null;}
function buyMix(x){if(G.gold<MIX[x].p)return 'Not enough gold';G.gold-=MIX[x].p;G.inv.mix[x]=(G.inv.mix[x]||0)+1;return null;}
function buySpirit(i){const st=G.stock.spirits[i];if(!st)return 'Gone';if(G.gold<CONFIG.spiritPrice)return 'Not enough gold';G.gold-=CONFIG.spiritPrice;const s=newSpirit(st);G.spirits[s.id]=s;G.stock.spirits.splice(i,1);log('Bought '+s.name+' from the shrine.');return null;}
function buyMold(id){const e=[...G.stock.molds,...G.stock.dealer].find(m=>m.id===id);if(!e)return 'Not on the cart';if(G.gold<e.price)return 'Not enough gold';G.gold-=e.price;G.inv.mold[id]=(G.inv.mold[id]||0)+1;
 G.stock.molds=G.stock.molds.filter(m=>m!==e);G.stock.dealer=G.stock.dealer.filter(m=>m!==e);log('Bought a '+MOLDS[id].name+' mold for '+e.price+'g.');return null;}
function grantItem(code){if(!code)return '';const [k,id]=code.split(':');if(k==='mat'){G.inv.mat[id]=(G.inv.mat[id]||0)+1;return MATS[id].n;}if(k==='food'){G.inv.food[id]=(G.inv.food[id]||0)+1;return FOODS[id].n;}if(k==='mold'){G.inv.mold[id]=(G.inv.mold[id]||0)+1;return MOLDS[id].name+' mold';}return '';}

// --- requests ---
function fitWith(req,v,s){return req.cons.map(c=>{const [t,k,g]=c;let ok=false;
 if(t==='aff'||t==='stat')ok=Math.min(s?Math.max(s.v[k]||0,v.floors[k]):v.floors[k],v.caps[k])>=bandBot(g);else if(t==='size')ok=v.size===k;else if(t==='tag')ok=v.tags.includes(k);else if(t==='species')ok=v.mold===k;
 else if(t==='temper')ok=s?band(s.temper)===k:null;else if(t==='mood')ok=s?mband(s.mood)===k:null;
 return {c,ok};});}
function fit(req,v){return fitWith(req,v,spiritOf(v));}
function previewSpirit(choice){if(choice&&choice.startsWith('shop:')){const st=G.stock.spirits[+choice.slice(5)];return st?{v:{},temper:st.temper,mood:st.mood}:null;}return choice&&G.spirits[choice]||null;}
function conText(c){const [t,k,g]=c;if(t==='aff'||t==='stat')return k.toUpperCase()+' ≥ '+g;return k.toUpperCase();}
function deliver(quid,vid){const r=G.requests.find(q=>q.uid===quid),v=G.vessels[vid],s=spiritOf(v);if(!r||!s)return 'No';
 if(r.spiritReq&&v.spiritId!==r.spiritReq)return 'This customer wants their own spirit back';
 const f=fit(r,v);if(f.some(x=>!x.ok))return 'DECLINED — '+conText(f.find(x=>!x.ok).c)+' short';
 const M=MOLDS[v.mold];G.gold+=r.pay;G.rep+=1;G.deliveries++;let msg=CUST[r.c].n+' takes the '+v.name+' ('+s.name+'). +'+r.pay+'g, +1 rep.';
 const bonus=r.desire&&(M.gift===r.desire||mband(s.mood)===r.desire||band(s.temper)===r.desire);
 if(bonus){G.rep+=2;const g=grantItem(r.bonus);msg+=' BONUS: the '+(M.gift===r.desire?'gift':'temperament')+' fit. +2 rep'+(g?', '+g:'')+'.';}
 if(r.sit&&M.triggers.includes(r.sit)){G.rep-=1;msg+=' Complaint within the week: it '+M.vice+'. −1 rep.';}
 if(!r.kind){G.cust[r.c].step++;G.cust[r.c].ready=G.issue+CONFIG.cooldown;}const ut=applyUnlock(r.unlock);if(ut)msg+=' '+ut;
 s.owner=r.c;s.vesselId='sold';s.hist.push('Issue '+G.issue+': went to work for '+CUST[r.c].n+'.');
 G.sold.push({spiritId:s.id,vname:v.name,mold:v.mold,tier:v.tier,c:r.c,cons:r.cons,pay:r.pay,issue:G.issue});
 delete G.vessels[vid];G.requests=G.requests.filter(q=>q.uid!==quid);G.done[r.id]=G.issue;log(msg);return null;}
function accept(quid){const r=G.requests.find(q=>q.uid===quid);if(r){r.accepted=1;log('Accepted '+r.title+'. No deadline while you work on it.');}}
function decline(quid){const r=G.requests.find(q=>q.uid===quid);G.requests=G.requests.filter(q=>q.uid!==quid);if(!r.kind)G.cust[r.c].ready=G.issue+CONFIG.cooldown;log('Declined '+r.title+'. '+CUST[r.c].n+' will ask again in a few issues.');}
function bumpCons(cons){const out=cons.filter(c=>c[0]!=='size').map(c=>c.slice());const i=out.findIndex(c=>c[0]==='aff'||c[0]==='stat');if(i>=0)out[i][2]=GR[Math.min(5,gi(out[i][2])+1)];return out;}
function checkOutgrow(){for(const so of G.sold.slice()){const s=G.spirits[so.spiritId];s.exp+=CONFIG.expPerIssue;const th=so.tier===1?CONFIG.outgrow1:CONFIG.outgrow2;
 if(s.exp>=th){G.sold=G.sold.filter(x=>x!==so);s.vesselId=null;s.owner=null;s.exp=Math.floor(s.exp*CONFIG.transferKeep);s.hist.push('Issue '+G.issue+': outgrew the '+so.vname+' and came home.');
  G.requests.push({id:'u:'+so.spiritId,uid:uid('q'),c:so.c,title:'UPGRADE: '+s.name.toUpperCase()+' HAS OUTGROWN THE '+so.vname.toUpperCase(),text:'It cracked the thing clean through. It is sitting in your box now. Same spirit, bigger body, please.',cons:bumpCons(so.cons),pay:Math.round(so.pay*1.5),due:6,desire:null,hint:'The spirit remembers the house.',sit:null,spiritReq:s.id,kind:'upgrade'});
  log(CUST[so.c].n+' is back: '+s.name+' outgrew the '+so.vname+'.');}}}

// --- expeditions ---
function send(vid,loc){if(G.exped)return 'One expedition at a time';const L=LOCS[loc];if(L.unlock&&!G.unl.loc.includes(loc))return L.unlockText;const v=G.vessels[vid];if(!v||!spiritOf(v))return 'Empty';G.exped={vesselId:vid,loc,step:0,haul:[],await:false};log(spiritOf(v).name+' set out for '+L.n+'.');return null;}
function pressOn(){if(G.exped)G.exped.await=false;}
function returnHome(){const e=G.exped;if(!e)return;e.haul.forEach(grantItem);const v=G.vessels[e.vesselId];log(spiritOf(v).name+' came home from '+LOCS[e.loc].n+' with '+(e.haul.length||'no')+' finds.');G.exped=null;}
function resolveExped(){const e=G.exped;if(!e||e.await)return;const L=LOCS[e.loc],v=G.vessels[e.vesselId],s=spiritOf(v),[stat,th,reward]=L.trials[e.step];
 G.disc[e.loc]=G.disc[e.loc]||{};G.disc[e.loc][e.step]=true;
 if(effVal(v,s,stat)>=th){e.haul.push(reward);const gain=Math.max(0,Math.min(CONFIG.trialGain,bandTop(L.lvl)-s.v[stat],v.caps[stat]-s.v[stat]));s.v[stat]+=gain;e.step++;
  s.hist.push('Issue '+G.issue+': passed '+stat+' trial at '+L.n+'.');log(s.name+' passed the '+stat+' trial ('+th+'). +'+gain+' '+stat+'.');
  if(e.step>=L.trials.length){log('Cleared '+L.n+'!');returnHome();}else e.await=true;}
 else{const kept=e.haul.slice(0,Math.floor(e.haul.length/2));kept.forEach(grantItem);s.vesselId=null;delete G.vessels[v.id];
  s.hist.push('Issue '+G.issue+': the '+v.name+' broke at '+L.n+'. Came home bodiless.');log('The '+v.name+' broke on the '+stat+' trial ('+th+'). '+s.name+' is home in the box with '+kept.length+' finds.');G.exped=null;}}

// --- the day ---
function nextIssue(){
 for(const r of G.requests.slice()){if(r.accepted)continue;r.due--;if(r.due<=0){G.requests=G.requests.filter(q=>q!==r);G.rep-=2;if(!r.kind)G.cust[r.c].ready=G.issue+CONFIG.cooldown;log('Missed the deadline: '+r.title+'. −2 rep. '+CUST[r.c].n+' will ask again later.');}}
 checkOutgrow();resolveExped();G.issue++;Object.values(G.vessels).forEach(v=>v.used=0);rollStock();
 for(const c in CUST){if(entered(c)&&!G.cust[c].seen){G.cust[c].seen=1;log(CUST[c].n+' ('+CUST[c].t+') heard about the shop and will be by with a request.');}}
 const rr=shuffle(readyRungs());let n=0;while(G.requests.length<CONFIG.maxActive&&n<CONFIG.newPerIssue&&rr.length){postRung(rr.shift());n++;}
 log('Issue '+G.issue+' goes to press.'+(dealerIn()?' The machine dealer is in town.':''));}
function exportState(){return JSON.stringify({CONFIG,G});}
function importState(txt){const o=JSON.parse(txt);if(!o.G||!o.G.vessels||!o.G.inv||!o.G.inv.mold||!o.G.cust)throw new Error('pickle is from an older version');CONFIG={...CONFIG,...o.CONFIG};G=o.G;}

// --- tutorial: steps advance on state, each unlocks tabs ---
const cleanerPace=()=>Math.max(0,...roster().filter(v=>v.tags.includes('cleans')).map(v=>effVal(v,spiritOf(v),'Pace')));
const TUT=[
 {tab:'front',text:'Welcome to the shop. Kōda the baker\'s order is on the counter. The badges are the floor you have to meet: EMBER ≥ C, SMALL, DOCILE. Press **Accept** so the clock stops while you work.',done:()=>G.done.r1||G.requests.some(r=>r.id==='r1'&&r.accepted),unlock:['specials']},
 {tab:'specials',text:'Gokuraku Junk prints its stock every issue. **Charcoal** is on special: grade C Ember, which sets a C floor on its own. Buy one. Then buy the **Teapot** from Sasaki\'s antique cart: molds are old objects, used up when you build, and some turn up more often than others.',done:()=>G.done.r1||((G.inv.mat.charcoal>0||Object.values(G.vessels).some(v=>v.mats.includes('charcoal')))&&(G.inv.mold.teapot>0||Object.values(G.vessels).some(v=>v.mold==='teapot'))),unlock:['order']},
 {tab:'order',text:'Fill in the coupon: mold **Teapot**, material **Charcoal**, the spirit from your box. A candle is the obvious oven-keeper, but read Kōda\'s hint: the teapot\'s gift warms the milk, and a candle gutters in a draft. Watch the strip change as you pick. **Place order**.',done:()=>{const r=G.requests.find(q=>q.id==='r1');return G.done.r1||(r&&roster().some(v=>fit(r,v).every(x=>x.ok)));},unlock:['roster']},
 {tab:'roster',text:'Your creature is in the color insert. Each cell reads current grade over cap; hover one for the numbers. Now Front Page → **Deliver…** → Hand over to Kōda.',done:()=>!!G.done.r1,unlock:[]},
 {tab:'front',text:'Paid, plus a bonus for the gift match. Shiraishi\'s floors are next: **Accept** her order.',done:()=>G.done.r4||G.requests.some(r=>r.id==='r4'&&r.accepted),unlock:[]},
 {tab:'order',text:'Mold **Whisk** (you own one), material **Rice straw** (you own one too), a spirit from the shrine (25g). It sweeps, but its Pace is only D and she wants C.',done:()=>G.done.r4||roster().some(v=>v.tags.includes('cleans')),unlock:['workshop']},
 {tab:'specials',text:'The machine dealer is on the cart this issue; he comes by every other issue. Buy the **Foot treadle**. Old training machines are vessels like any other: build one and it is installed in the Workshop.',done:()=>G.done.r4||G.inv.mold.treadle>0||machines().length>0,unlock:[]},
 {tab:'order',text:'Mold **Foot treadle**, no material needed, a spirit from the shrine. An empty machine does nothing; a possessed one trains a stat up to its own spirit\'s grade, and every session wears it in: the machine\'s own grade climbs with use, up to its cap, and then the dealer offers a bigger one.',done:()=>G.done.r4||machines().some(v=>v.spiritId),unlock:[]},
 {tab:'workshop',text:'Feed the whisk a **Sweet potato**: +5 Pace, and 8 toxicity that never comes back. Then train its Pace once at the **Foot treadle**. One session per machine per day.',done:()=>G.done.r4||cleanerPace()>=18,unlock:['travel']},
 {tab:'travel',text:'Pace 19 is still D, one point short of C. Send the whisk to the **Riverbank Shallows**: its first trial is a Pace check, and passing one raises the stat. Then **Go to press** to end the issue.',done:()=>G.done.r4||(G.exped&&G.exped.await)||(!G.exped&&cleanerPace()>=20),unlock:['ledger']},
 {tab:'travel',text:'The report is in. The next trial is Wits, and your whisk has none; a failed trial breaks the body. **Return home** with the haul.',done:()=>G.done.r4||!G.exped,unlock:[]},
 {tab:'front',text:'Pace C. Front Page → deliver to Shiraishi. Her hint about a bad run is the whisk\'s gift.',done:()=>!!G.done.r4,unlock:[]},
 {tab:'front',text:'That is the whole loop: read the card, find a mold, build cheap, raise what is missing, deliver. Every tab is open now. Each customer has a ladder of commissions; the street box at the foot of the Front Page shows who is next and what each delivery unlocks. On the coupon, pick an order under **Designing for** and the badges check themselves as you choose. Declining is free; a missed deadline is not.',done:()=>false,unlock:[],end:true},
];
function advanceTut(){if(G.tut==null||G.tut<0)return;while(G.tut<TUT.length&&TUT[G.tut].done())G.tut++;if(G.tut>=TUT.length)G.tut=-1;}
function unlockedTabs(){if(G.tut==null||G.tut<0)return null;const s=new Set(['front']);for(let i=0;i<G.tut;i++)TUT[i].unlock.forEach(t=>s.add(t));return s;}

<script>
// ===== UI =====
const $=s=>document.querySelector(s);

function act(fn){const e=fn();advanceTut();if(e)toast(e);save();render();}
function tutHTML(){if(G.tut==null||G.tut<0)return '';const T=TUT[G.tut];const txt=esc(T.text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 return `<div class="box dbl tut"><div class="row sb"><span class="kick">Beginner's column · ${T.end?'the end':'step '+(G.tut+1)+' of '+(TUT.length-1)}</span><span class="row">${T.end?'':`<button data-act="tutgo">Go to ${TABS.find(t=>t[0]===T.tab)[1]}</button>`}<button data-act="tutskip">${T.end?'Close':'Skip tutorial'}</button></span></div><p>${txt}</p></div>`;}

function svgCreature(v,s){const dom=s?AFF.reduce((a,b)=>s.v[b]>s.v[a]?b:a,AFF[0]):null;const col=s&&s.v[dom]>0?COLOR[dom]:COLOR.none;
 const maxv=s?Math.max(...STATS.concat(AFF).map(k=>effVal(v,s,k))):0;const R=REG[v.art];const lit=s?Math.min(R.length,1+Math.floor(maxv/15)):0;
 const fill=i=>i<lit?col:'#f6eedc';const parts=R.map((p,i)=>p.replace(/%F/g,fill(i)));
 const eyes=s?EYES[v.art].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#1c1915"/><circle cx="${x+.8}" cy="${y-.8}" r=".8" fill="${col}"/>`).join(''):'';
 const ring=v.tier===2?'<rect x="2" y="2" width="60" height="60" fill="none" stroke="#1c1915" stroke-dasharray="3 3"/>':'';
 return `<svg viewBox="0 0 64 64" stroke="#1c1915" stroke-width="2.2" stroke-linejoin="round">${ring}${parts.join('')}${eyes}</svg>`;}
const REG={candle:['<rect x="16" y="54" width="32" height="6" fill="%F"/>','<rect x="22" y="26" width="20" height="30" rx="3" fill="%F"/>','<ellipse cx="26" cy="30" rx="3" ry="5" fill="%F"/><ellipse cx="38" cy="33" rx="3" ry="6" fill="%F"/>','<path d="M32 6 C25 15 25 20 32 25 C39 20 39 15 32 6 Z" fill="%F"/>'],
 chime:['<path d="M14 36 A18 18 0 0 1 50 36 Z" fill="%F"/>','<rect x="27" y="46" width="10" height="14" fill="%F"/>','<line x1="32" y1="36" x2="32" y2="43"/><circle cx="32" cy="44" r="3.5" fill="%F"/>'],
 whisk:['<rect x="29" y="4" width="6" height="24" fill="%F"/>','<rect x="24" y="28" width="16" height="6" fill="%F"/>','<path d="M20 34 L44 34 L50 58 L14 58 Z" fill="%F"/>'],

 ladle:['<rect x="30" y="6" width="5" height="30" fill="%F"/>','<path d="M14 36 L50 36 L46 56 L18 56 Z" fill="%F"/>','<rect x="18" y="40" width="28" height="6" fill="%F"/>'],
 kokeshi:['<rect x="22" y="30" width="20" height="28" rx="4" fill="%F"/>','<circle cx="32" cy="18" r="12" fill="%F"/>','<circle cx="26" cy="23" r="2" fill="%F"/><circle cx="38" cy="23" r="2" fill="%F"/>','<circle cx="32" cy="44" r="4" fill="%F"/>'],
 hibachi:['<rect x="12" y="30" width="40" height="24" rx="3" fill="%F"/>','<rect x="8" y="26" width="48" height="6" fill="%F"/>','<circle cx="24" cy="22" r="4" fill="%F"/><circle cx="32" cy="20" r="4" fill="%F"/><circle cx="40" cy="22" r="4" fill="%F"/>'],
 washtub:['<path d="M10 28 L54 28 L50 56 L14 56 Z" fill="%F"/>','<rect x="8" y="24" width="48" height="6" fill="%F"/>','<rect x="18" y="34" width="28" height="4" fill="%F"/>'],
 planter:['<path d="M18 36 L46 36 L42 58 L22 58 Z" fill="%F"/>','<rect x="14" y="32" width="36" height="6" fill="%F"/>','<path d="M32 32 C28 20 20 16 16 18 C18 26 26 30 32 32 Z" fill="%F"/><path d="M32 32 C36 18 44 14 48 16 C46 24 38 30 32 32 Z" fill="%F"/>'],
 wheel:['<rect x="28" y="32" width="8" height="22" fill="%F"/><rect x="14" y="54" width="36" height="6" fill="%F"/>','<ellipse cx="32" cy="30" rx="22" ry="7" fill="%F"/>','<ellipse cx="32" cy="28" rx="8" ry="3" fill="%F"/>'],
 icechest:['<rect x="12" y="24" width="40" height="32" rx="2" fill="%F"/>','<rect x="10" y="18" width="44" height="8" rx="2" fill="%F"/>','<rect x="28" y="38" width="8" height="4" fill="%F"/>'],
 treadle:['<path d="M8 50 L56 38 L58 44 L10 56 Z" fill="%F"/>','<rect x="28" y="44" width="8" height="14" fill="%F"/>','<circle cx="46" cy="28" r="9" fill="%F"/>']};

 hibachi:[[24,44],[40,44]],washtub:[[26,46],[38,46]],planter:[[27,46],[37,46]],wheel:[[22,31],[42,31]],icechest:[[24,46],[40,46]],treadle:[[43,28],[49,28]]};

function stripHTML(v,s){const cell=(k,aff)=>{const val=s?effVal(v,s,k):v.floors[k];const str=s&&s.v[k]>v.caps[k];return `<div class="cell ${aff?'aff':''} ${v.caps[k]<10?'cap0':''} ${str?'str':''}" style="${aff?'border-top-color:'+COLOR[k]:''}" title="${k}: ${val} now · floor ${v.floors[k]} · cap ${v.caps[k]} (${gradeOf(v.caps[k])})"><div class="k">${k}</div><div class="g">${gradeOf(val)}<small>/${gradeOf(v.caps[k])}</small></div></div>`;};
 return `<div class="strip2">${STATS.map(k=>cell(k)).join('')}</div><div class="strip2 aff">${AFF.map(k=>cell(k,1)).join('')}</div>`;}

 ${s?`<div class="muted" style="font-size:12px">${tempText(s)} · exp ${s.exp}${straining(v,s)?' · <span class="stamp" style="font-size:10px;padding:0 4px">straining</span>':''}</div>`:''}</div></div>
 ${stripHTML(v,s)}${s?`<div class="kick">Toxicity ${s.tox}/${CONFIG.toxCap}</div>${therm(s.tox,CONFIG.toxCap,true)}`:''}
 <div class="rel">${v.rel.length?v.rel.join(' · '):'No pairs in this vessel'}${v.mix.length?' · '+v.mix.map(x=>MIX[x].n).join(', '):''}</div>
 <div class="row" style="margin-top:6px">${extra}${s?`<button data-act="open" data-id="${v.id}">${open?'Close':'Diary'}</button>`:''}</div>
 ${open&&s?`<div class="diary">${s.hist.slice().reverse().map(h=>`<div>${esc(h)}</div>`).join('')||'<div>Nothing yet.</div>'}</div>`:''}</div>`;}

 advanceTut();const un=unlockedTabs();if(un&&!un.has(UI.tab))UI.tab='front';const goTab=un&&!TUT[G.tut].end?TUT[G.tut].tab:null;
 $('#strip').innerHTML=`<span>Issue <b>No. ${G.issue}</b></span><span>Gold <b>${G.gold}g</b></span><span>Reputation <b>${G.rep}</b></span><span>Shelf <b>${roster().length}</b></span><span class="sp"></span><button class="pri" data-act="next">Go to press → next issue</button>`;
 $('#tabs').innerHTML=TABS.map(([id,n])=>`<button class="${UI.tab===id?'on':''} ${goTab===id?'go':''}" data-act="tab" data-id="${id}" ${un&&!un.has(id)?'disabled title="Unlocks later in the tutorial"':''}>${n}${id==='front'&&G.requests.length?' ('+G.requests.length+')':''}</button>`).join('');
 $('#tut').innerHTML=tutHTML();
 $('#view').innerHTML=({front,order,specials,workshop,roster:rosterTab,travel,ledger})[UI.tab]();}

function front(){const cards=G.requests.map(r=>{const C=CUST[r.c];const pk=UI.pick[r.uid];const idx=C.ladder.indexOf(r.id);return `<div class="box dbl">
 <div class="row sb"><span class="kick">${esc(C.n)} · ${esc(C.t)} · ${r.kind?'follow-up':'commission '+(idx+1)+' of '+C.ladder.length}</span>${r.accepted?'<span class="kick">accepted · no deadline</span>':`<span class="kick" style="color:${r.due<=1?'var(--red)':''}">due in ${r.due}</span>`}</div>
 <div class="hl">${esc(r.title)}</div><div class="copy">“${esc(r.text)}”</div>${r.hint?`<div class="hint">${esc(r.hint)}</div>`:''}
 <div class="badges">${r.cons.map(c=>badge(c)).join('')}${r.sit?`<span class="bd" style="border-style:dashed">${SIT[r.sit]}</span>`:''}</div>
 ${r.unlock?`<div class="muted" style="font-size:12px">Delivering unlocks: ${unlockText(r.unlock)}.</div>`:''}
 <div class="row sb" style="margin-top:6px"><span class="price">${r.pay}<small>g budget</small></span><span class="row"><button data-act="decline" data-id="${r.uid}" class="red">Decline</button>${r.accepted?'':`<button data-act="accept" data-id="${r.uid}">Accept</button>`}<button data-act="design" data-id="${r.uid}">Design for this</button><button class="pri" data-act="pick" data-id="${r.uid}">${pk?'Hide':'Deliver…'}</button></span></div>
 ${pk?`<div style="margin-top:8px;border-top:2px dashed var(--ink);padding-top:8px">${roster().map(v=>{const s=spiritOf(v);const f=fit(r,v);const ok=f.every(x=>x.ok)&&(!r.spiritReq||v.spiritId===r.spiritReq);return `<div class="row sb line"><span><b>${esc(s.name)}</b> the ${vlabel(v)}${r.spiritReq&&v.spiritId!==r.spiritReq?' <span class="muted">(not their spirit)</span>':''}</span><span class="badges" style="margin:0">${f.map(x=>badge(x.c,x.ok)).join('')}</span><button class="pri" data-act="deliver" data-id="${r.uid}" data-v="${v.id}" ${ok?'':'disabled'}>Hand over</button></div>`}).join('')||'<span class="muted">Nothing on the shelf.</span>'}</div>`:''}

 const matOpt=(m,i)=>{const MM=MATS[m];const own=G.inv.mat[m]||0;const p=matPrice(G,m);const lab=own?`owned ×${own}`:p==null?(MM.rare?'not in stock':'SOLD OUT'):p+'g'+(G.stock.special===m?' SPECIAL':'')+(G.stock.limited===m?' LIMIT 1':'');return `<option value="${m}" ${o.mats[i]===m?'selected':''} ${(!own&&p==null)?'disabled':''}>${want.has(MM.a)?'★ ':''}${MM.n} — ${MM.a} ${MM.g} — ${lab}</option>`;};

 <label>Mold (from your stock) <select data-f="mold">${owned.map(m=>`<option value="${m}" ${o.mold===m?'selected':''}>${MOLDS[m].name} ×${G.inv.mold[m]} — ${MOLDS[m].station?'machine: trains '+MOLDS[m].station.join(' + '):(MOLDS[m].native||'no native')+' · '+MOLDS[m].tags.join(', ')} — ${MOLDS[m].size||TIER[MOLDS[m].tier].size}</option>`).join('')}</select></label>
 ${Array.from({length:slots},(_,i)=>`<label>Material ${i+1}${i>=T.mat?' (lacing)':''} <select data-f="mat" data-i="${i}"><option value="">— none —</option>${matKeys.map(m=>matOpt(m,i)).join('')}</select></label>`).join('')}
 <label>Mix-in <select data-f="mix"><option value="">— none —</option>${Object.keys(MIX).map(x=>`<option value="${x}" ${o.mix===x?'selected':''}>${MIX[x].n} — ${MIX[x].text} — ${G.inv.mix[x]?'owned ×'+G.inv.mix[x]:MIX[x].p+'g'}</option>`).join('')}</select></label>

 </div>
 <div class="receipt">${cost.err?`<div style="color:var(--red)">${cost.err}</div>`:cost.items.map(i=>`<div><span>${esc(i[0])}</span><span>${i[1]}g</span></div>`).join('')+`<div class="tot"><span>TOTAL</span><span>${cost.total}g</span></div>`+(req?`<div><span>BUDGET (${esc(CUST[req.c].n)})</span><span>${req.pay}g</span></div><div><span>MARGIN before raising</span><span style="color:${req.pay-cost.total<0?'var(--red)':''}">${req.pay-cost.total}g</span></div>`:'')}</div>

 ${e.await?`<div class="note">Passed. Press on for the next trial, or come home with the haul.</div><div class="row"><button class="pri" data-act="presson">Press on</button><button data-act="return">Return home</button></div>`:'<div class="note">On the road. The next trial resolves when the issue goes to press.</div>'}</div>`:'';
 return report+`<div class="grid wide">${locs}</div>`;}

function ledger(){const cust=Object.keys(CUST).map(c=>{const C=CUST[c],S=G.cust[c];const n=G.sold.filter(s=>s.c===c).length;return `<div class="line"><div class="row sb"><span><b>${esc(C.n)}</b> <span class="muted">${esc(C.t)}</span></span><span class="muted">${n} in service${entered(c)?'':' · not yet a customer'}</span></div><div class="badges">${C.ladder.map((id,i)=>{const R=REQ[id];const done=i<S.step,cur=i===S.step;return `<span class="bd ${done?'met':''}" style="${!done&&!cur?'opacity:.45':''}">${i+1}. ${done||cur?esc(R.title):'? ? ?'}${cur&&R.unlock?' · unlocks '+esc(unlockText(R.unlock)):''}</span>`}).join('')}</div></div>`}).join('');
 return `<div class="two"><div><div class="box" style="margin-bottom:12px"><div class="kick">Ledger</div><div class="hl">What happened</div><div class="log">${G.log.map(l=>`<div><b>No.${l.i}</b>${esc(l.t)}</div>`).join('')}</div></div>
 <div class="box"><div class="kick">Customer files</div><div class="hl">The street</div>${cust}<div class="muted" style="margin-top:6px;font-size:12px">Sold creatures gain ${CONFIG.expPerIssue} exp an issue and outgrow a small body at ${CONFIG.outgrow1}, a medium one at ${CONFIG.outgrow2}. Then the customer comes back.</div>
 ${G.sold.map(s=>`<div class="muted" style="font-size:12px">${esc(G.spirits[s.spiritId].name)} the ${s.vname} at ${CUST[s.c].n}'s · exp ${G.spirits[s.spiritId].exp}</div>`).join('')}</div></div>
 <div><div class="box" style="margin-bottom:12px"><div class="kick">Pickle</div><div class="hl">Save &amp; load</div><div class="muted" style="font-size:12px">Progress autosaves in this browser. Copy the pickle to keep a state or send it back with notes.</div>
 <div class="row" style="margin:6px 0"><button data-act="pickle">Export pickle</button><button data-act="unpickle">Load pickle below</button><button class="red" data-act="newgame">${UI.confirmNew?'Really start over?':'New game'}</button></div><textarea id="pickle" rows="6" placeholder="pickle JSON">${esc(UI.pickle)}</textarea></div>
 <div class="box"><div class="kick">Tuning</div><div class="hl">The numbers</div><div class="muted" style="font-size:12px">Edit and apply. Takes effect immediately; saved with the pickle.</div><textarea id="cfg" rows="8">${esc(JSON.stringify(CONFIG,null,1))}</textarea><div class="row" style="margin-top:6px"><button data-act="cfg">Apply tuning</button></div></div></div></div>`;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],button[data-f]');if(!b)return;const id=b.dataset.id,a=b.dataset.act;
 if(b.dataset.f){const f=b.dataset.f,v=b.dataset.v;if(f==='tk'){UI.train.key=v;}render();return;}
 if(a==='tab'){UI.tab=id;render();return;}
 if(a==='tutskip'){G.tut=-1;save();render();return;}
 if(a==='tutgo'){UI.tab=TUT[G.tut].tab;render();return;}
 if(a==='next'){act(()=>{nextIssue();UI.pick={};});return;}
 if(a==='pick'){UI.pick[id]=!UI.pick[id];render();return;}
 if(a==='open'){UI.open[id]=!UI.open[id];render();return;}
 if(a==='deliver'){act(()=>deliver(id,b.dataset.v));return;}
 if(a==='decline'){act(()=>{decline(id);});return;}
 if(a==='accept'){act(()=>{accept(id);});return;}
 if(a==='design'){UI.order.forReq=id;UI.tab='order';render();return;}
 if(a==='place'){const o=UI.order;act(()=>{const e=placeOrder(o.mold,o.mats.filter(Boolean),o.mix?[o.mix]:[],o.spirit);if(!e){o.mats=[];o.mix='';o.spirit='';toast(MOLDS[o.mold]&&MOLDS[o.mold].station?'Built and installed in the Workshop.':'Order placed. See the Roster.');}return e;});return;}
 if(a==='buymat'){act(()=>buyMat(id));return;}if(a==='buyfood'){act(()=>buyFood(id));return;}if(a==='buymix'){act(()=>buyMix(id));return;}if(a==='buyspirit'){act(()=>buySpirit(+id));return;}if(a==='buymold'){act(()=>buyMold(id));return;}
 if(a==='train'){act(()=>train(UI.train.id,UI.train.vid,UI.train.key));return;}
 if(a==='feed'){act(()=>feed(UI.feed.vid,UI.feed.fid));return;}
 if(a==='transfer'){act(()=>transferOut(id));return;}
 if(a==='salvage'){act(()=>salvage(id));return;}
 if(a==='possessempty'){act(()=>{const e=possessEmpty(id,UI.pe.sid);if(!e)UI.pe={vid:'',sid:''};return e;});return;}
 if(a==='send'){act(()=>send(UI.send.vid,id));return;}
 if(a==='presson'){act(()=>{pressOn();});return;}if(a==='return'){act(()=>{returnHome();});return;}
 if(a==='pickle'){UI.pickle=exportState();render();navigator.clipboard&&navigator.clipboard.writeText(UI.pickle).then(()=>toast('Pickle copied to clipboard'),()=>toast('Pickle is in the box below'));return;}
 if(a==='unpickle'){try{importState($('#pickle').value);save();toast('Loaded');}catch(err){toast('That pickle did not load: '+err.message);}render();return;}
 if(a==='newgame'){if(!UI.confirmNew){UI.confirmNew=true;render();return;}UI.confirmNew=false;newGame();save();render();return;}
 if(a==='cfg'){try{const c=JSON.parse($('#cfg').value);Object.assign(CONFIG,c);save();toast('Tuning applied');}catch(err){toast('Bad JSON: '+err.message);}render();return;}
});
document.addEventListener('change',e=>{const s=e.target;if(!s.dataset.f)return;const f=s.dataset.f,v=s.value;
 if(f==='forReq')UI.order.forReq=v;else if(f==='mold'){UI.order.mold=v;UI.order.mats=[];}else if(f==='mat')UI.order.mats[+s.dataset.i]=v;else if(f==='mix')UI.order.mix=v;else if(f==='spirit')UI.order.spirit=v;
 else if(f==='tst'){UI.train.id=v;UI.train.key='';UI.train.vid='';}else if(f==='tv')UI.train.vid=v;else if(f==='fv')UI.feed.vid=v;else if(f==='ff')UI.feed.fid=v;
 else if(f==='pe')UI.pe={vid:s.dataset.id,sid:v};else if(f==='send')UI.send={loc:s.dataset.id,vid:v};
 render();});
if(!load()){newGame();}render();
</script>

</body>
</html>
